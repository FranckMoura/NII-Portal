<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - NII</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f2f5;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
        }
        .login-card {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px;
        }
        .logo { width: 80px; margin-bottom: 20px; }
        input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd;
            border-radius: 5px; box-sizing: border-box; font-size: 16px;
        }
        button {
            width: 100%; padding: 12px; background: #0056b3; color: white;
            border: none; border-radius: 5px; font-size: 16px; cursor: pointer;
            font-weight: bold; transition: 0.2s;
        }
        button:hover { background: #004494; }
        .error { color: red; font-size: 14px; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 style="color: #333;">Portal NII</h2>
        <p style="color: #666; font-size: 14px;">Acesso restrito à diretoria e faturamento.</p>
        
        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">
        
        <button onclick="fazerLogin()">Entrar</button>
        <div id="msgErro" class="error">Usuário ou senha incorretos.</div>
    </div>

    <script>
        function fazerLogin() {
            const u = document.getElementById('usuario').value;
            const s = document.getElementById('senha').value;
            const msg = document.getElementById('msgErro');

            // --- CONFIGURE AQUI SEU LOGIN E SENHA ---
            // Nota: Isso fica visível se alguém inspecionar o código, 
            // mas serve para barrar curiosos.
            const usuarioCorreto = "admin";
            const senhaCorreta = "hbsh2025"; 

            if (u === usuarioCorreto && s === senhaCorreta) {
                // Salva na memória do navegador que o usuário está logado
                sessionStorage.setItem("nii_autenticado", "true");
                window.location.href = "index.html"; // Redireciona para o painel
            } else {
                msg.style.display = "block";
            }
        }

        // Se apertar Enter, tenta logar
        document.addEventListener('keydown', function(e) {
            if(e.key === 'Enter') fazerLogin();
        });
    </script>
</body>
</html>
