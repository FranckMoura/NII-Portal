        /* =========================================
           ESTILO DE IMPRESSÃO (Otimizado)
           ========================================= */
        @media print {
            @page { size: A4; margin: 1cm; }
            
            body { background: white !important; font-size: 11px !important; color: black !important; }
            .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            
            /* Esconder elementos inúteis na impressão */
            .no-print, .btn, .dataTables_filter, .dataTables_length, .dataTables_paginate, .dataTables_info, select {

            .card-kpi h2 { font-size: 14px !important; margin: 0; }
            .card-kpi small { font-size: 9px !important; }

            /* Gráficos menores */
            .chart-box { height: 180px !important; page-break-inside: avoid; border: 1px solid #ccc; margin-bottom: 10px; }
            canvas { max-height: 100%; max-width: 100%; }

            /* Tabela Estilo Excel */
            .table-container { box-shadow: none; padding: 0; margin-top: 10px; }
            table { width: 100% !important; border-collapse: collapse !important; font-size: 10px !important; }
            
            th, td {

                text-align: center;
            }
            
            th { background-color: #eee !important; font-weight: bold; color: black; -webkit-print-color-adjust: exact; }

            .badge { 
                background: none !important; 
                color: black !important; 
                border: none !important; 
                padding: 0; 
                font-weight: normal;
            }
            
            /* Evita quebrar linhas da tabela no meio */
            tr { page-break-inside: avoid; }
            thead { display: table-header-group; } 
            tfoot { display: table-row-group; }
        }

                language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json" },
                footerCallback: function (row, data, start, end, display) {
                    var api = this.api();
                    var intVal = function (i) { return typeof i === 'string' ? i.replace(/[\$,]/g, '')*1 : typeof i === 'number' ? i : 0; };
                    
                    $(api.column(3).footer()).html(api.column(3).data().reduce((a, b) => intVal(a) + intVal(b), 0));
                    $(api.column(4).footer()).html(api.column(4).data().reduce((a, b) => intVal(a) + intVal(b), 0));
                    $(api.column(5).footer()).html(api.column(5).data().reduce((a, b) => intVal(a) + intVal(b), 0));
                    $(api.column(6).footer()).html(api.column(6).data().reduce((a, b) => intVal(a) + intVal(b), 0));
                }
            });
        }

        function atualizarDashboard() {
            const mesSel = document.getElementById('filtroMes').value;
            let dados = dadosRaw;
            
            if (mesSel !== "TODOS") {
                dados = dadosRaw.filter(d => d.mes === mesSel);
            }

            let tVivos = 0, tMortos = 0, tObitos = 0, tTotal = 0;
            let tNormal = 0, tCesaria = 0;
            let procMap = {};

            dados.forEach(d => {
                tVivos += d.vivos;
                tMortos += d.mortos;
                tObitos += d.obitos;
                tTotal += d.total;
                
                if(d.grupo === 'NORMAL') tNormal += d.total;
                if(d.grupo === 'CESARIANA') tCesaria += d.total;

                if(!procMap[d.procedimento]) procMap[d.procedimento] = 0;
                procMap[d.procedimento] += d.total;
            });

            document.getElementById('kpiVivos').innerText = tVivos;
            document.getElementById('kpiTotal').innerText = tTotal;
            document.getElementById('kpiObitos').innerText = tMortos + tObitos;
            document.getElementById('kpiCesaria').innerText = tTotal > 0 ? ((tCesaria/tTotal)*100).toFixed(1) + '%' : '0%';

            initTable(dados);
            atualizarGraficos(tNormal, tCesaria, procMap);
        }

        function atualizarGraficos(normal, cesaria, procMap) {
            const ctx1 = document.getElementById('chartPizza').getContext('2d');
            if(chartPizza) chartPizza.destroy();
            chartPizza = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['Normal', 'Cesariana'],
                    datasets: [{ data: [normal, cesaria], backgroundColor: ['#20c997', '#fd7e14'], borderWidth: 1 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10 } } } }
            });

            const sortedProcs = Object.entries(procMap).sort((a,b) => b[1] - a[1]).slice(0, 8);
            const labelsBar = sortedProcs.map(p => p[0]);
            const dataBar = sortedProcs.map(p => p[1]);
            const colorsBar = labelsBar.map(l => l.includes('CESARIANA') ? '#fd7e14' : '#20c997');

            const ctx2 = document.getElementById('chartBarras').getContext('2d');
            if(chartBarras) chartBarras.destroy();
            chartBarras = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: labelsBar,
                    datasets: [{
                        label: 'Qtd',
                        data: dataBar,
                        backgroundColor: colorsBar,
                        barThickness: 15
                    }]
                },
                options: {
                    indexAxis: 'y', 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true, ticks: { font: { size: 9 } } }, y: { ticks: { font: { size: 9 } } } }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => { atualizarDashboard(); });
    </script>
</body>
</html>
