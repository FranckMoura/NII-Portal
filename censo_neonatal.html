<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo UTI Neonatal - Santa Helena</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1280px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Cabeçalho */
        header { border-bottom: 2px solid #005f73; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .voltar-btn { text-decoration: none; color: #666; font-size: 14px; background: #eee; padding: 5px 10px; border-radius: 5px;}
        .voltar-btn:hover { background: #ddd; color: #000; }

        /* PAINEL DE INDICADORES (TABELA DE GESTÃO) */
        .panel-container { margin-bottom: 30px; overflow-x: auto; border: 1px solid #ccc; border-radius: 8px; }
        .panel-table { width: 100%; border-collapse: collapse; text-align: center; }
        .panel-table th { background-color: #005f73; color: white; padding: 12px; font-size: 13px; text-transform: uppercase; border-right: 1px solid #0a9396; }
        .panel-table td { padding: 10px; border: 1px solid #ddd; font-weight: bold; font-size: 14px; }
        .panel-total { background-color: #e9ecef; border-top: 2px solid #999; }
        
        .row-utin { border-left: 6px solid #005f73; background-color: #fdfdfd; }
        .row-ucinco { border-left: 6px solid #2a9d8f; background-color: #fdfdfd; }
        .row-ucinca { border-left: 6px solid #e9c46a; background-color: #fdfdfd; }

        /* Formulário */
        .controls { background: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 25px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; border: 1px solid #dee2e6; }
        .form-group { flex: 1; display: flex; flex-direction: column; min-width: 150px; }
        .form-group label { font-size: 11px; font-weight: bold; color: #555; margin-bottom: 4px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; height: 40px; }
        .btn-add { background-color: #0a9396; min-width: 100px; } .btn-add:hover { background-color: #005f73; }
        .btn-del { background-color: #ae2012; padding: 5px 10px; font-size: 12px; height: auto; }
        
        /* Rodapé */
        .footer-actions { margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; justify-content: flex-end; }
        .btn-export { background-color: #ee9b00; } 
        .btn-import { background-color: #6c757d; }

        /* Tabela Detalhada */
        .main-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        .main-table th { background-color: #457b9d; color: white; padding: 10px; text-align: left; }
        .main-table td { padding: 10px; border-bottom: 1px solid #eee; }
        .main-table tr:hover { background-color: #f8f9fa; }
        
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: white; display: inline-block; min-width: 80px; text-align: center; }
        .bg-internado { background-color: #0a9396; } 
        .bg-alta { background-color: #94d2bd; color: #004b23; } 
        .bg-obito { background-color: #ae2012; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <a href="index.html" class="voltar-btn">⬅ Voltar ao Menu</a>
            <span style="margin-left: 15px; font-weight: bold; color: #005f73; font-size: 20px;">🏥 Censo UTI Neonatal</span>
        </div>
        <div style="text-align: right;">
            <label style="font-size: 11px; font-weight: bold; display:block; color:#666;">COMPETÊNCIA:</label>
            <input type="month" id="mesReferencia" style="padding: 5px; font-weight:bold; color:#005f73;" onchange="renderizarTabela()">
        </div>
    </header>

    <div class="panel-container">
        <div style="background:#005f73; color:white; padding:10px; font-weight:bold; font-size:14px;">📊 Painel de Indicadores Mensais</div>
        <table class="panel-table">
            <thead>
                <tr>
                    <th>Setor</th>
                    <th>Leitos</th>
                    <th>Capac.<br>(Dias)</th>
                    <th>Pacientes<br>Dia</th>
                    <th>Ocupação<br>(%)</th>
                    <th>Média<br>Perm.(Dias)</th>
                    <th>Saídas<br>(Altas/Transf)</th>
                    <th>Óbitos<br>(Total)</th>
                    <th>Óbito<br>&lt; 24h</th>
                    <th>Óbito<br>&gt; 24h</th>
                </tr>
            </thead>
            <tbody id="tabelaIndicadores">
                </tbody>
        </table>
    </div>

    <div class="controls">
        <div class="form-group" style="flex: 2;">
            <label>Nome do Paciente</label>
            <input type="text" id="nomePaciente" placeholder="Digite o nome completo...">
        </div>
        <div class="form-group">
            <label>Setor</label>
            <select id="setor">
                <option value="UTIN">UTIN (Intensiva)</option>
                <option value="UCINCO">UCINCO (Médio Risco)</option>
                <option value="UCINCA">UCINCA (Canguru)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Data Admissão</label>
            <input type="date" id="dataAdmissao">
        </div>
        <div class="form-group">
            <label>Data Saída (Se houver)</label>
            <input type="date" id="dataSaida">
        </div>
        <div class="form-group" style="flex: 1.5;">
            <label>Motivo / Status</label>
            <select id="motivoSaida">
                <option value="">(Paciente Internado)</option>
                <option value="ALTA">Alta Médica</option>
                <option value="TRANSF">Transferência</option>
                <option value="OBITO > 24H">Óbito > 24h</option>
                <option value="OBITO < 24H">Óbito < 24h</option>
            </select>
        </div>
        <button class="btn-add" onclick="adicionarPaciente()">+ Salvar</button>
    </div>

    <h3 style="font-size:16px; color:#555; margin-bottom:10px; border-bottom:1px solid #ddd; padding-bottom:5px;">Lista de Pacientes no Mês</h3>
    <table class="main-table">
        <thead>
            <tr>
                <th>Paciente</th>
                <th>Setor</th>
                <th>Admissão</th>
                <th>Saída</th>
                <th style="text-align: center;">Dias (Mês)</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabelaPacientes">
            </tbody>
    </table>

    <div class="footer-actions">
        <input type="file" id="inputImport" style="display: none;" accept=".json" onchange="processarImportacao(this)">
        <button class="btn-import" onclick="document.getElementById('inputImport').click()">📂 Importar Backup / JSON</button>
        <button class="btn-export" onclick="exportarParaExcel()">📥 Baixar Planilha (CSV)</button>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO (CNES) ---
    const CONFIG_LEITOS = {
        'UTIN': 18,
        'UCINCO': 4,
        'UCINCA': 3
    };

    let pacientes = [];

    window.onload = function() {
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        document.getElementById('mesReferencia').value = `${ano}-${mes}`;

        // Tenta carregar dados
        const dadosSalvos = localStorage.getItem('censo_uti_v3');
        if (dadosSalvos) {
            pacientes = JSON.parse(dadosSalvos);
        }
        renderizarTabela();
    };

    function salvarDados() {
        localStorage.setItem('censo_uti_v3', JSON.stringify(pacientes));
        renderizarTabela();
    }

    function processarImportacao(input) {
        const arquivo = input.files[0];
        if (!arquivo) return;
        const leitor = new FileReader();
        leitor.onload = function(e) {
            try {
                const dadosImportados = JSON.parse(e.target.result);
                if (Array.isArray(dadosImportados)) {
                    if (confirm(`Encontrados ${dadosImportados.length} registros.\nSUBSTITUIR dados atuais?`)) {
                        pacientes = dadosImportados;
                        salvarDados();
                        alert("Importado com sucesso!");
                    }
                }
            } catch (erro) { alert("Erro ao ler JSON."); }
            input.value = '';
        };
        leitor.readAsText(arquivo);
    }

    // --- DATA HELPERS ---
    function criarData(dataString) {
        if (!dataString) return null;
        const [ano, mes, dia] = dataString.split('-').map(Number);
        // Usa meio-dia (12:00) para evitar bugs de fuso horário
        return new Date(ano, mes - 1, dia, 12, 0, 0); 
    }

    function formatarDataBR(dataIso) {
        if (!dataIso) return '-';
        const [a, m, d] = dataIso.split('-');
        return `${d}/${m}/${a}`;
    }

    // --- CÁLCULO HOSPITALAR (PADRÃO SUS) ---
    function renderizarTabela() {
        const tbodyList = document.getElementById('tabelaPacientes');
        tbodyList.innerHTML = '';
        
        const refInput = document.getElementById('mesReferencia').value; 
        if (!refInput) return;

        const [refAno, refMes] = refInput.split('-').map(Number);
        
        // Intervalo do Mês (12:00 para segurança de fuso)
        const inicioMes = new Date(refAno, refMes - 1, 1, 12, 0, 0); 
        const fimMes = new Date(refAno, refMes, 0, 12, 0, 0); // Último dia do mês
        const qtdDiasNoMes = fimMes.getDate();

        // Inicializa Stats
        let stats = {
            'UTIN':   { p_dia: 0, saidas: 0, obitos: 0, obito_menor: 0, obito_maior: 0 },
            'UCINCO': { p_dia: 0, saidas: 0, obitos: 0, obito_menor: 0, obito_maior: 0 },
            'UCINCA': { p_dia: 0, saidas: 0, obitos: 0, obito_menor: 0, obito_maior: 0 }
        };

        pacientes.sort((a,b) => a.nome.localeCompare(b.nome));

        pacientes.forEach((p, index) => {
            // Normaliza Setor
            let setorRaw = p.setor ? p.setor.toUpperCase().trim() : 'UTIN';
            let setor = 'UTIN';
            if (setorRaw.includes('UCINCO') || setorRaw.includes('MÉDIO')) setor = 'UCINCO';
            if (setorRaw.includes('UCINCA') || setorRaw.includes('CANGURU')) setor = 'UCINCA';
            
            const dtAdm = criarData(p.admissao);
            const dtSaida = p.saida ? criarData(p.saida) : null;
            
            // --- FILTRO DE COMPETÊNCIA ---
            // Ignora se entrou depois ou saiu antes deste mês
            if (dtAdm > fimMes) return;
            if (dtSaida && dtSaida < inicioMes) return;

            // --- LÓGICA DE DIAS (PACIENTE-DIA) ---
            let diasCalc = 0;
            
            // Data de Início Efetiva
            const inicioContagem = dtAdm > inicioMes ? dtAdm : inicioMes;
            
            // Data de Fim Efetiva
            let fimContagem = fimMes;
            let saiuNesteMes = false;

            if (dtSaida && dtSaida <= fimMes) {
                fimContagem = dtSaida;
                saiuNesteMes = true;
            }

            // Diferença matemática em dias
            const diffTempo = fimContagem - inicioContagem;
            const diffDias = Math.floor(diffTempo / (1000 * 60 * 60 * 24));
            
            // APLICAÇÃO DA REGRA DE CENSO (MEIA-NOITE)
            if (saiuNesteMes) {
                // Se SAIU, o dia da saída NÃO conta (liberou leito antes da meia-noite)
                // Ex: Entrou 01, Saiu 05. (5-1) = 4 dias.
                diasCalc = diffDias;

                // EXCEÇÃO: Entrou e saiu no MESMO dia = 1 dia.
                if (diasCalc === 0 && dtAdm.getDate() === dtSaida.getDate()) {
                    diasCalc = 1;
                }
            } else {
                // Se CONTINUA internado, conta o último dia do mês (pois dormiu lá)
                // Ex: Entrou 01, Mês 30. (30-1) = 29. Mas ficou dia 30. Total 30.
                diasCalc = diffDias + 1;
            }

            // Segurança
            if (diasCalc < 0) diasCalc = 0;

            // --- ACUMULA DADOS ---
            if (diasCalc > 0 || (saiuNesteMes && diasCalc >= 0)) {
                if (diasCalc > 0) stats[setor].p_dia += diasCalc;

                // Verifica evento de saída neste mês
                if (saiuNesteMes && dtSaida >= inicioMes) {
                    const motivo = (p.motivo || '').toUpperCase();
                    if (motivo.includes('BITO') || motivo.includes('FALEC')) {
                        stats[setor].obitos++;
                        if (motivo.includes('<') || motivo.includes('MENOR')) stats[setor].obito_menor++;
                        else stats[setor].obito_maior++;
                    } else {
                        stats[setor].saidas++; // Altas + Transferências
                    }
                }

                // Renderiza na Tabela
                let bgBadge = 'bg-internado';
                let motivoTexto = p.motivo || 'INTERNADO';
                const motivoUpper = motivoTexto.toUpperCase();

                if (motivoUpper.includes('BITO')) bgBadge = 'bg-obito';
                else if (p.saida) { bgBadge = 'bg-alta'; motivoTexto = p.motivo || 'ALTA'; }

                let html = `
                <tr>
                    <td><strong>${p.nome}</strong></td>
                    <td>${setor}</td>
                    <td>${formatarDataBR(p.admissao)}</td>
                    <td>${formatarDataBR(p.saida)}</td>
                    <td style="text-align:center; font-weight:bold;">${diasCalc}</td>
                    <td><span class="badge ${bgBadge}">${motivoTexto}</span></td>
                    <td><button class="btn-del" onclick="removerPaciente(${index})">X</button></td>
                </tr>`;
                tbodyList.innerHTML += html;
            }
        });

        atualizarPainelIndicadores(stats, qtdDiasNoMes);
    }

    function atualizarPainelIndicadores(stats, diasNoMes) {
        const tbodyInd = document.getElementById('tabelaIndicadores');
        tbodyInd.innerHTML = '';

        let tLeitos=0, tCapac=0, tPDia=0, tSaidas=0, tObitos=0, tObMenor=0, tObMaior=0;

        ['UTIN', 'UCINCO', 'UCINCA'].forEach(setor => {
            const dados = stats[setor];
            const leitos = CONFIG_LEITOS[setor];
            const capacidade = leitos * diasNoMes;
            
            // Taxa Ocupação
            const ocupacao = capacidade > 0 ? (dados.p_dia / capacidade) * 100 : 0;
            
            // Média Permanência: Padrão = Paciente-Dia / (Altas + Óbitos)
            const totalSaidasPeriodo = dados.saidas + dados.obitos;
            const mediaPerm = totalSaidasPeriodo > 0 ? (dados.p_dia / totalSaidasPeriodo) : 0;

            // Totais
            tLeitos += leitos; tCapac += capacidade; tPDia += dados.p_dia;
            tSaidas += dados.saidas; tObitos += dados.obitos;
            tObMenor += dados.obito_menor; tObMaior += dados.obito_maior;

            let rowClass = `row-${setor.toLowerCase()}`;
            
            tbodyInd.innerHTML += `
            <tr class="${rowClass}">
                <td style="text-align:left;">${setor}</td>
                <td>${leitos}</td>
                <td>${capacidade}</td>
                <td>${dados.p_dia}</td>
                <td style="${ocupacao > 100 ? 'color:red' : 'color:#005f73'}">${ocupacao.toFixed(2)}%</td>
                <td>${mediaPerm.toFixed(1)}</td>
                <td>${dados.saidas}</td>
                <td style="color:${dados.obitos > 0 ? 'red' : 'inherit'}; font-weight:bold;">${dados.obitos}</td>
                <td>${dados.obito_menor}</td>
                <td>${dados.obito_maior}</td>
            </tr>`;
        });

        // Total Geral
        const ocupacaoGeral = tCapac > 0 ? (tPDia / tCapac) * 100 : 0;
        const totalSaidasGeral = tSaidas + tObitos;
        const mediaPermGeral = totalSaidasGeral > 0 ? (tPDia / totalSaidasGeral) : 0;

        tbodyInd.innerHTML += `
        <tr class="panel-total">
            <td style="text-align:left;">TOTAL GERAL</td>
            <td>${tLeitos}</td>
            <td>${tCapac}</td>
            <td>${tPDia}</td>
            <td>${ocupacaoGeral.toFixed(2)}%</td>
            <td>${mediaPermGeral.toFixed(1)}</td>
            <td>${tSaidas}</td>
            <td style="color:red; font-weight:bold;">${tObitos}</td>
            <td>${tObMenor}</td>
            <td>${tObMaior}</td>
        </tr>`;
    }

    function adicionarPaciente() {
        const nome = document.getElementById('nomePaciente').value.toUpperCase();
        const setor = document.getElementById('setor').value;
        const adm = document.getElementById('dataAdmissao').value;
        const saida = document.getElementById('dataSaida').value;
        const motivo = document.getElementById('motivoSaida').value;

        if (!nome || !adm) { alert('Preencha Nome e Admissão.'); return; }
        
        // Validação ano
        if (adm.substring(0,4) > "2025") {
            if(!confirm("Ano futuro ("+adm.substring(0,4)+"). Confirma?")) return;
        }

        pacientes.push({ nome, setor, admissao: adm, saida, motivo });
        
        document.getElementById('nomePaciente').value = '';
        document.getElementById('dataSaida').value = '';
        document.getElementById('motivoSaida').value = '';
        salvarDados();
    }

    function removerPaciente(index) {
        if(confirm('Tem certeza?')) {
            pacientes.splice(index, 1);
            salvarDados();
        }
    }

    function exportarParaExcel() {
        let csv = "Nome;Setor;Admissao;Saida;Motivo;Dias\n";
        pacientes.forEach(p => {
            csv += `${p.nome};${p.setor};${formatarDataBR(p.admissao)};${formatarDataBR(p.saida)};${p.motivo}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.setAttribute("href", URL.createObjectURL(blob));
        link.setAttribute("download", "Censo_HSH.csv");
        document.body.appendChild(link);
        link.click();
    }
</script>
</body>
</html>
