<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NII - Módulo Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .folder-header { transition: all 0.3s ease; }
        .folder-header:hover { background-color: #f8fafc; }
        .rotate-icon { transform: rotate(180deg); }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg">
                        <i class="fa-solid fa-file-invoice-dollar text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-800">Painel Financeiro</h1>
                        <p class="text-xs text-slate-500">Gestão de Repasses e Produção</p>
                    </div>
                </div>
                <div class="flex items-center">
                    <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-blue-600 transition-colors">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao Portal
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div id="container-pastas" class="space-y-6">
            <div class="text-center py-10">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-500 text-3xl"></i>
                <p class="mt-2 text-gray-500">Carregando dados financeiros...</p>
            </div>
        </div>

    </main>

    <script>
        // Mapa para ordenar os meses corretamente
        const mesesMap = {
            'JANEIRO': 1, 'FEVEREIRO': 2, 'MARÇO': 3, 'ABRIL': 4, 'MAIO': 5, 'JUNHO': 6,
            'JULHO': 7, 'AGOSTO': 8, 'SETEMBRO': 9, 'OUTUBRO': 10, 'NOVEMBRO': 11, 'DEZEMBRO': 12
        };

        function parseValor(valorStr) {
            if (!valorStr || valorStr === '---') return 0;
            return parseFloat(valorStr.replace('R$', '').replace('.', '').replace(',', '.').trim());
        }

        // Ordena competências (Dezembro antes de Novembro)
        function sortCompetencias(a, b) {
            const [mesA, anoA] = a.split('/');
            const [mesB, anoB] = b.split('/');
            
            if (anoA !== anoB) return parseInt(anoB) - parseInt(anoA);
            return mesesMap[mesB.toUpperCase()] - mesesMap[mesA.toUpperCase()];
        }

        async function carregarFinanceiro() {
            const container = document.getElementById('container-pastas');
            
            try {
                // Força o navegador a não usar cache do JSON
                const response = await fetch('arquivos/dados_financeiro.json?v=' + new Date().getTime());
                const dados = await response.json();

                // 1. Agrupar por Competência (NORMALIZADO PARA MAIÚSCULO)
                const grupos = {};
                dados.forEach(item => {
                    // Transforma "Novembro/2025" em "NOVEMBRO/2025" para agrupar junto
                    let comp = (item.competencia || "Outros").toUpperCase();
                    if (!grupos[comp]) grupos[comp] = [];
                    grupos[comp].push(item);
                });

                // 2. Ordenar as pastas (Mês mais recente primeiro)
                const competenciasOrdenadas = Object.keys(grupos).sort(sortCompetencias);

                container.innerHTML = '';

                if (competenciasOrdenadas.length === 0) {
                    container.innerHTML = `<div class="text-center text-gray-400 py-10">Nenhum relatório encontrado.</div>`;
                    return;
                }

                // 3. Gerar HTML
                competenciasOrdenadas.forEach((comp, index) => {
                    let itens = grupos[comp];
                    
                    // ORDENAÇÃO INTERNA DOS CARDS
                    // Capa (começa com "00") primeiro, depois alfabético
                    itens.sort((a, b) => a.titulo.localeCompare(b.titulo));

                    // Calcula total (excluindo a capa que não tem valor)
                    const totalMes = itens.reduce((acc, item) => acc + parseValor(item.valor_total), 0);
                    
                    // A primeira pasta já vem aberta
                    const isOpen = index === 0;
                    const hiddenClass = isOpen ? '' : 'hidden';
                    const rotateClass = isOpen ? 'rotate-180' : '';

                    const pastaHTML = `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <button onclick="togglePasta('pasta-${index}', 'icon-${index}')" class="folder-header w-full flex items-center justify-between p-5 text-left bg-white border-b border-gray-100 cursor-pointer outline-none">
                                <div class="flex items-center gap-4">
                                    <div class="bg-blue-50 text-blue-600 w-12 h-12 rounded-lg flex items-center justify-center border border-blue-100 shadow-sm">
                                        <i class="fa-regular fa-folder-open text-xl"></i>
                                    </div>
                                    <div>
                                        <h2 class="text-lg font-bold text-slate-800 capitalize">${comp.toLowerCase()}</h2>
                                        <p class="text-sm text-slate-500">${itens.length} arquivos disponíveis</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-6">
                                    <div class="text-right hidden sm:block">
                                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Total Consolidado</p>
                                        <p class="text-lg font-bold text-green-600">R$ ${totalMes.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                                    </div>
                                    <i id="icon-${index}" class="fa-solid fa-chevron-down text-slate-400 transition-transform duration-300 ${rotateClass}"></i>
                                </div>
                            </button>

                            <div id="pasta-${index}" class="bg-slate-50 p-5 ${hiddenClass}">
                                <div class="grid grid-cols-1 gap-3">
                                    ${itens.map(item => {
                                        // Destaque visual diferente para a CAPA
                                        const isCapa = item.titulo.includes("CAPA");
                                        const iconClass = isCapa ? "fa-solid fa-book text-white" : "fa-solid fa-file-contract text-white";
                                        const bgClass = isCapa ? "bg-slate-800" : "bg-blue-600";
                                        const borderClass = isCapa ? "border-slate-300" : "border-slate-200";
                                        
                                        return `
                                        <div class="bg-white p-4 rounded-lg border ${borderClass} shadow-sm hover:shadow-md transition-all flex flex-col sm:flex-row items-center justify-between gap-4">
                                            <div class="flex items-center gap-4 w-full sm:w-auto">
                                                <div class="${bgClass} w-10 h-10 rounded-full flex items-center justify-center shrink-0 shadow-sm">
                                                    <i class="${iconClass}"></i>
                                                </div>
                                                <div>
                                                    <h3 class="font-semibold text-slate-800 text-sm sm:text-base">${item.titulo}</h3>
                                                    <div class="flex items-center gap-3 text-xs text-slate-500 mt-1">
                                                        <span><i class="fa-regular fa-clock mr-1"></i> ${item.data_geracao}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div class="flex items-center justify-between w-full sm:w-auto gap-6 pl-14 sm:pl-0">
                                                <div class="text-right ${isCapa ? 'hidden' : ''}">
                                                    <span class="block text-[10px] text-slate-400 font-bold uppercase">VALOR</span>
                                                    <span class="block font-bold text-slate-700">${item.valor_total}</span>
                                                </div>
                                                <a href="${item.arquivo}" target="_blank" class="bg-white border border-gray-300 hover:bg-gray-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-sm">
                                                    <i class="fa-solid fa-eye text-blue-600"></i> Abrir
                                                </a>
                                            </div>
                                        </div>
                                    `}).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += pastaHTML;
                });

            } catch (error) {
                console.error("Erro:", error);
                container.innerHTML = `<div class="text-center text-red-500 py-10"><i class="fa-solid fa-triangle-exclamation text-4xl mb-2"></i><br>Erro ao carregar.<br>Tente atualizar a página (F5).</div>`;
            }
        }

        function togglePasta(idPasta, idIcone) {
            const conteudo = document.getElementById(idPasta);
            const icone = document.getElementById(idIcone);
            
            if (conteudo.classList.contains('hidden')) {
                conteudo.classList.remove('hidden');
                icone.classList.add('rotate-180');
            } else {
                conteudo.classList.add('hidden');
                icone.classList.remove('rotate-180');
            }
        }

        document.addEventListener('DOMContentLoaded', carregarFinanceiro);
    </script>
</body>
</html>
