<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NII - Módulo Financeiro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Animação suave para os cards */
        .report-card { transition: all 0.2s ease; border-left-width: 5px; }
        .report-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <a href="index.html" class="flex-shrink-0 flex items-center gap-2">
                        <img src="img/logo.png" alt="Logo" class="h-8 w-auto">
                        <span class="font-bold text-xl text-blue-800">NII Financeiro</span>
                    </a>
                    <div class="hidden md:ml-6 md:flex md:space-x-4 items-center">
                        <a href="index.html" class="text-gray-500 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Início</a>
                        <a href="faturamento.html" class="text-gray-500 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Faturamento</a>
                        <a href="#" class="bg-blue-50 text-blue-700 px-3 py-2 rounded-md text-sm font-medium">Financeiro</a>
                        <a href="painel_regulacao.html" class="text-gray-500 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Regulação</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-900"><i class="fa-solid fa-file-invoice-dollar text-blue-600 mr-2"></i>Relatórios de Fechamento</h1>
                <p class="text-gray-500 text-sm mt-1">Consolidado de repasses médicos, terceiros e financiamento.</p>
            </div>
            <div class="w-full md:w-1/3">
                <div class="relative">
                    <input type="text" id="filtroInput" onkeyup="filtrarRelatorios()" 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none shadow-sm text-sm" 
                        placeholder="Pesquisar (ex: Rateio, Novembro)...">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-search text-gray-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <div id="lista-relatorios" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full flex justify-center py-12">
                <div class="text-center">
                    <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-3xl mb-3"></i>
                    <p class="text-gray-500">Carregando dados do fechamento...</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        // --- CONFIGURAÇÃO CORRIGIDA ---
        // Aponta para o arquivo que você confirmou: 'dados_financeiro.json'
        const URL_JSON = 'arquivos/dados_financeiro.json'; 

        async function carregarRelatorios() {
            const container = document.getElementById('lista-relatorios');
            
            try {
                // Adiciona timestamp para evitar cache do navegador
                const response = await fetch(URL_JSON + '?v=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`Arquivo JSON não encontrado (${URL_JSON}).`);
                }
                
                const dados = await response.json();
                container.innerHTML = '';

                if (dados.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full bg-white rounded-lg p-10 text-center shadow-sm">
                            <i class="fa-solid fa-folder-open text-gray-300 text-5xl mb-4"></i>
                            <p class="text-gray-500">Nenhum relatório encontrado.</p>
                        </div>`;
                    return;
                }

                // Renderiza os cards
                dados.forEach(item => {
                    // Lógica de Cores e Ícones (Tailwind)
                    let borderClass = 'border-blue-500'; // Padrão (Financiamento)
                    let textClass = 'text-blue-600';
                    let bgIcon = 'bg-blue-100';
                    let icon = 'fa-chart-line';

                    // Converte para minúsculas para facilitar a verificação
                    const titulo = (item.titulo || "").toLowerCase();

                    if(titulo.includes('rateio') || titulo.includes('equipe')) {
                        borderClass = 'border-green-500';
                        textClass = 'text-green-600';
                        bgIcon = 'bg-green-100';
                        icon = 'fa-user-md';
                    }
                    else if(titulo.includes('terceiros') || titulo.includes('sadt')) {
                        borderClass = 'border-yellow-500';
                        textClass = 'text-yellow-600';
                        bgIcon = 'bg-yellow-100';
                        icon = 'fa-truck-medical';
                    }
                    else if(titulo.includes('fila zero')) {
                        borderClass = 'border-purple-500';
                        textClass = 'text-purple-600';
                        bgIcon = 'bg-purple-100';
                        icon = 'fa-bolt';
                    }

                    const html = `
                    <div class="report-card bg-white rounded-lg shadow-sm p-5 flex flex-col justify-between h-full ${borderClass}">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="${bgIcon} ${textClass} w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0">
                                        <i class="fa-solid ${icon}"></i>
                                    </div>
                                    <h3 class="font-semibold text-gray-800 text-lg leading-tight line-clamp-2">${item.titulo}</h3>
                                </div>
                            </div>
                            
                            <div class="mt-4 flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-100">
                                <div class="flex flex-col">
                                    <span class="text-xs text-gray-400 uppercase font-semibold">Competência</span>
                                    <span class="text-sm font-medium text-gray-700">
                                        <i class="fa-regular fa-calendar mr-1"></i>${item.competencia}
                                    </span>
                                </div>
                                <div class="flex flex-col text-right">
                                    <span class="text-xs text-gray-400 uppercase font-semibold">Valor Total</span>
                                    <span class="text-lg font-bold text-gray-900">${item.valor_total}</span>
                                </div>
                            </div>

                            <p class="text-xs text-gray-400 mt-3 flex items-center">
                                <i class="fa-regular fa-clock mr-1"></i> Gerado em: ${item.data_geracao}
                            </p>
                        </div>

                        <a href="${item.arquivo}" target="_blank" 
                           class="mt-5 w-full bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 hover:text-blue-700 hover:border-blue-300 font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 group">
                            <span>Visualizar Relatório</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs group-hover:translate-x-0.5 transition-transform"></i>
                        </a>
                    </div>
                    `;
                    container.innerHTML += html;
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="col-span-full text-center py-10">
                        <div class="bg-red-50 text-red-600 p-4 rounded-lg inline-block">
                            <i class="fa-solid fa-circle-exclamation text-2xl mb-2"></i>
                            <p class="font-medium">Erro ao carregar os relatórios.</p>
                            <p class="text-sm opacity-75 mt-1">Verifique se o arquivo <b>${URL_JSON}</b> existe na pasta correta.</p>
                        </div>
                    </div>`;
            }
        }

        function filtrarRelatorios() {
            const termo = document.getElementById('filtroInput').value.toLowerCase();
            const cards = document.querySelectorAll('.report-card');

            cards.forEach(card => {
                const texto = card.innerText.toLowerCase();
                if(texto.includes(termo)) {
                    card.style.display = 'flex'; 
                } else {
                    card.style.display = 'none';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', carregarRelatorios);
    </script>
</body>
</html>
