<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NII - Módulo Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .folder-header { transition: all 0.3s ease; }
        .folder-header:hover { background-color: #f8fafc; }
        .rotate-icon { transform: rotate(180deg); }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg">
                        <i class="fa-solid fa-file-invoice-dollar text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-800">Painel Financeiro</h1>
                        <p class="text-xs text-slate-500">Gestão de Repasses e Produção</p>
                    </div>
                </div>
                <div class="flex items-center">
                    <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-blue-600 transition-colors">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Voltar ao Portal
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div id="container-pastas" class="space-y-6">
            <div class="text-center py-10">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-500 text-3xl"></i>
                <p class="mt-2 text-gray-500">Carregando dados financeiros...</p>
            </div>
        </div>

    </main>

    <script>
        // Mapa para ordenar os meses corretamente
        const mesesMap = {
            'JANEIRO': 1, 'FEVEREIRO': 2, 'MARÇO': 3, 'ABRIL': 4, 'MAIO': 5, 'JUNHO': 6,
            'JULHO': 7, 'AGOSTO': 8, 'SETEMBRO': 9, 'OUTUBRO': 10, 'NOVEMBRO': 11, 'DEZEMBRO': 12
        };

        // Função para converter valor string "R$ 1.000,00" em float
        function parseValor(valorStr) {
            if (!valorStr) return 0;
            return parseFloat(valorStr.replace('R$', '').replace('.', '').replace(',', '.').trim());
        }

        // Função para ordenar competências (Mais recente primeiro)
        function sortCompetencias(a, b) {
            const [mesA, anoA] = a.split('/');
            const [mesB, anoB] = b.split('/');
            
            if (anoA !== anoB) return parseInt(anoB) - parseInt(anoA);
            return mesesMap[mesB.toUpperCase()] - mesesMap[mesA.toUpperCase()];
        }

        async function carregarFinanceiro() {
            const container = document.getElementById('container-pastas');
            
            try {
                // Busca o JSON (ajuste o caminho se necessário)
                const response = await fetch('arquivos/dados_financeiro.json');
                const dados = await response.json();

                // 1. Agrupar por Competência
                const grupos = {};
                dados.forEach(item => {
                    const comp = item.competencia || "Outros";
                    if (!grupos[comp]) grupos[comp] = [];
                    grupos[comp].push(item);
                });

                // 2. Ordenar as chaves (meses)
                const competenciasOrdenadas = Object.keys(grupos).sort(sortCompetencias);

                container.innerHTML = ''; // Limpa loading

                // 3. Gerar HTML para cada grupo
                competenciasOrdenadas.forEach((comp, index) => {
                    const itens = grupos[comp];
                    
                    // Calcula total do mês
                    const totalMes = itens.reduce((acc, item) => acc + parseValor(item.valor_total), 0);
                    
                    // Define se a pasta começa aberta (apenas a primeira/mais recente)
                    const isOpen = index === 0;
                    const hiddenClass = isOpen ? '' : 'hidden';
                    const rotateClass = isOpen ? 'rotate-180' : '';

                    const pastaHTML = `
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <button onclick="togglePasta('pasta-${index}', 'icon-${index}')" class="folder-header w-full flex items-center justify-between p-5 text-left bg-white border-b border-gray-100 cursor-pointer outline-none">
                                <div class="flex items-center gap-4">
                                    <div class="bg-blue-50 text-blue-600 w-12 h-12 rounded-lg flex items-center justify-center border border-blue-100">
                                        <i class="fa-regular fa-folder-open text-xl"></i>
                                    </div>
                                    <div>
                                        <h2 class="text-lg font-bold text-slate-800">${comp}</h2>
                                        <p class="text-sm text-slate-500">${itens.length} relatórios disponíveis</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-6">
                                    <div class="text-right hidden sm:block">
                                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Total da Competência</p>
                                        <p class="text-lg font-bold text-green-600">R$ ${totalMes.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                                    </div>
                                    <i id="icon-${index}" class="fa-solid fa-chevron-down text-slate-400 transition-transform duration-300 ${rotateClass}"></i>
                                </div>
                            </button>

                            <div id="pasta-${index}" class="bg-slate-50 p-5 ${hiddenClass}">
                                <div class="grid grid-cols-1 gap-4">
                                    ${itens.map(item => `
                                        <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col sm:flex-row items-center justify-between gap-4">
                                            <div class="flex items-center gap-4 w-full sm:w-auto">
                                                <div class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center shrink-0">
                                                    <i class="fa-solid fa-file-contract"></i>
                                                </div>
                                                <div>
                                                    <h3 class="font-semibold text-slate-800">${item.titulo}</h3>
                                                    <div class="flex items-center gap-3 text-xs text-slate-500 mt-1">
                                                        <span><i class="fa-regular fa-calendar mr-1"></i> ${item.competencia}</span>
                                                        <span><i class="fa-regular fa-clock mr-1"></i> Gerado em: ${item.data_geracao.split(' ')[0]}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div class="flex items-center justify-between w-full sm:w-auto gap-6 pl-14 sm:pl-0">
                                                <div class="text-right">
                                                    <span class="block text-xs text-slate-400 font-medium">VALOR</span>
                                                    <span class="block font-bold text-slate-700 text-lg">${item.valor_total}</span>
                                                </div>
                                                <a href="${item.arquivo}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                                                    <i class="fa-solid fa-eye"></i> Visualizar
                                                </a>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += pastaHTML;
                });

            } catch (error) {
                console.error("Erro:", error);
                container.innerHTML = `<div class="text-center text-red-500 py-10"><i class="fa-solid fa-triangle-exclamation text-4xl mb-2"></i><br>Erro ao carregar dados financeiros.<br>Verifique se o arquivo JSON existe.</div>`;
            }
        }

        // Função para abrir/fechar pastas
        function togglePasta(idPasta, idIcone) {
            const conteudo = document.getElementById(idPasta);
            const icone = document.getElementById(idIcone);
            
            if (conteudo.classList.contains('hidden')) {
                conteudo.classList.remove('hidden');
                icone.classList.add('rotate-180');
            } else {
                conteudo.classList.add('hidden');
                icone.classList.remove('rotate-180');
            }
        }

        // Inicia
        document.addEventListener('DOMContentLoaded', carregarFinanceiro);
    </script>
</body>
</html>
