<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NII - Módulo Financeiro</title>
    
    <script src="js/auth.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .folder-header { transition: all 0.3s ease; }
        .folder-header:hover { background-color: #f8fafc; }
        .rotate-icon { transform: rotate(180deg); }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <a href="index.html" class="flex-shrink-0 flex items-center gap-2">
                        <span class="font-bold text-xl text-blue-800">NII Financeiro</span>
                    </a>
                    <div class="hidden md:ml-6 md:flex md:space-x-4 items-center">
                        <a href="index.html" class="text-gray-500 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Início</a>
                        <a href="faturamento.html" class="text-gray-500 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Faturamento</a>
                        <a href="#" class="bg-blue-50 text-blue-700 px-3 py-2 rounded-md text-sm font-medium">Financeiro</a>
                        <a href="painel_regulacao.html" class="text-gray-500 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium">Regulação</a>
                    </div>
                </div>
                
                <div class="flex items-center">
                    <div class="hidden md:flex items-center space-x-4">
                        <span class="text-xs text-gray-400">Hospital Santa Helena</span>
                        
                        <a href="#" onclick="fazerLogout()" class="text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded-md text-sm font-medium flex items-center gap-2 transition-colors">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Repasses & Financeiro</h1>
            <p class="text-gray-500 text-sm mt-1">Acesso aos espelhos de pagamento médico e rateio de equipe (Pool).</p>
        </div>

        <div id="financeiro-container" class="space-y-4">
            <div class="flex justify-center py-10">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-3xl"></i>
            </div>
        </div>

    </main>

    <script>
        async function carregarFinanceiro() {
            const container = document.getElementById('financeiro-container');
            
            try {
                // Carrega JSON (reutilizando o do faturamento ou um específico se criar depois)
                // Aqui vou usar o 'dados.json' que já tem a lista geral, e filtrar o que é financeiro
                const response = await fetch('dados.json?v=' + new Date().getTime());
                const arquivos = await response.json();

                // Filtra apenas arquivos que parecem ser do financeiro (ex: Repasse, Pagamento, NF)
                // Se quiser mostrar TODOS, basta remover o .filter
                const arqFinanceiro = arquivos.filter(a => 
                    a.nome.toLowerCase().includes('repasse') || 
                    a.nome.toLowerCase().includes('pagamento') ||
                    a.nome.toLowerCase().includes('financeiro') ||
                    a.nome.toLowerCase().includes('nf')
                );

                container.innerHTML = '';

                if (arqFinanceiro.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white rounded-lg shadow-sm p-10 text-center">
                            <i class="fa-solid fa-folder-open text-gray-300 text-5xl mb-4"></i>
                            <p class="text-gray-500">Nenhum documento financeiro encontrado no repositório.</p>
                        </div>
                    `;
                    return;
                }

                // Agrupa por Ano (Simulado com base no nome ou data)
                // Para simplificar, vou criar uma pasta única "Documentos Gerais"
                // Se quiser agrupar real, precisaria de lógica extra.
                
                const pastas = { 'Documentos Disponíveis': arqFinanceiro };

                Object.keys(pastas).forEach((pastaNome, index) => {
                    const arquivosDaPasta = pastas[pastaNome];
                    const idPasta = `pasta-${index}`;
                    const idIcone = `icon-${index}`;

                    let pastaHTML = `
                        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                            <div onclick="togglePasta('${idPasta}', '${idIcone}')" 
                                 class="folder-header p-4 cursor-pointer flex justify-between items-center select-none">
                                <div class="flex items-center gap-3">
                                    <div class="bg-blue-100 p-2 rounded-lg text-blue-600">
                                        <i class="fa-solid fa-folder text-xl"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-semibold text-gray-800">${pastaNome}</h3>
                                        <span class="text-xs text-gray-500">${arquivosDaPasta.length} arquivo(s)</span>
                                    </div>
                                </div>
                                <i id="${idIcone}" class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-300"></i>
                            </div>

                            <div id="${idPasta}" class="hidden border-t border-gray-100 bg-gray-50">
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4">
                                    ${arquivosDaPasta.map(arq => {
                                        // Ícone por tipo
                                        let iconColor = 'text-gray-500';
                                        let iconClass = 'fa-file';
                                        if(arq.nome.includes('.pdf')) { iconClass='fa-file-pdf'; iconColor='text-red-500'; }
                                        else if(arq.nome.includes('.xls')) { iconClass='fa-file-excel'; iconColor='text-green-500'; }
                                        
                                        return `
                                        <div class="bg-white p-3 rounded-md border border-gray-200 hover:shadow-md transition-shadow flex items-start gap-3">
                                            <i class="fa-solid ${iconClass} ${iconColor} text-xl mt-1"></i>
                                            <div class="flex-1 min-w-0">
                                                <p class="text-sm font-medium text-gray-700 truncate" title="${arq.nome}">${arq.nome}</p>
                                                <p class="text-xs text-gray-400 mt-1">${arq.data} • ${arq.tamanho}</p>
                                                <a href="${arq.caminho}" target="_blank" 
                                                   class="mt-2 text-xs font-semibold text-blue-600 hover:text-blue-800 hover:bg-blue-50 px-2 py-1 rounded transition-colors flex items-center gap-2 shadow-sm">
                                                    <i class="fa-solid fa-eye text-blue-600"></i> Abrir
                                                </a>
                                            </div>
                                        </div>
                                    `}).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += pastaHTML;
                });

            } catch (error) {
                console.error("Erro:", error);
                container.innerHTML = `<div class="text-center text-red-500 py-10"><i class="fa-solid fa-triangle-exclamation text-4xl mb-2"></i><br>Erro ao carregar.<br>Tente atualizar a página (F5).</div>`;
            }
        }

        function togglePasta(idPasta, idIcone) {
            const conteudo = document.getElementById(idPasta);
            const icone = document.getElementById(idIcone);
            
            if (conteudo.classList.contains('hidden')) {
                conteudo.classList.remove('hidden');
                icone.classList.add('rotate-180');
            } else {
                conteudo.classList.add('hidden');
                icone.classList.remove('rotate-180');
            }
        }

        document.addEventListener('DOMContentLoaded', carregarFinanceiro);
    </script>
</body>
</html>
