<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Fila Zero 2025 - NII</title>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background: #001528; background-image: linear-gradient(135deg, #000428 0%, #004e92 100%); color: white; min-height: 100vh; }
        .cyber-container { background: white; color: #334155; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid #e2e8f0; }
        
        table.dataTable { color: #334155 !important; border-collapse: collapse !important; width: 100% !important; }
        table.dataTable thead th { background-color: #004e92 !important; color: white !important; padding: 12px; font-size: 0.85rem; text-transform: uppercase; }
        table.dataTable tbody td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        table.dataTable tbody tr:hover { background-color: #f8fafc !important; }
        
        .dataTables_filter input { border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px 10px; outline: none; }
        .dataTables_length select { border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px; outline: none; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-[1200px] mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-3xl font-bold text-white"><i class="fas fa-list-ol text-cyan-300 mr-2"></i> Tabela Fila Zero 2025</h1>
                <p class="text-cyan-100 text-sm mt-1">Consulta rápida de Códigos e Valores (Média e Alta Complexidade)</p>
            </div>
            <a href="modulo_gerencial.html" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold px-4 py-2 rounded-lg transition"><i class="fas fa-arrow-left"></i> Voltar ao Módulo</a>
        </div>

        <div class="cyber-container">
            <div id="loading" class="text-center py-10 font-bold text-blue-600">
                <i class="fas fa-spinner fa-spin text-4xl mb-3"></i><br>Baixando tabela do Fila Zero...
            </div>

            <table id="tabelaFilaZero" class="display" style="display:none;">
                <thead>
                    <tr>
                        <th class="w-32 text-center">Cód. SIGTAP</th>
                        <th>Descrição do Procedimento</th>
                        <th class="w-32 text-center">Complexidade</th>
                        <th class="w-40 text-right">Valor Unitário</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Chaves Reais do seu Projeto Injetadas
        const SUPABASE_URL = "https://voweywtzoldwfhgkniup.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvd2V5d3R6b2xkd2ZoZ2tuaXVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxMDE1OTUsImV4cCI6MjA4MzY3NzU5NX0.aLtDv7A7_k41ag2CCQDb-PYcOE6UxJqhyl_g_PVtKl0";
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarDados() {
            try {
                const { data, error } = await client.from('fila_zero_procedimentos').select('*').order('descricao');
                
                $('#loading').hide();
                $('#tabelaFilaZero').show();

                if (error) throw error;
                
                if (data && data.length > 0) {
                    const tbody = $('#corpoTabela');
                    data.forEach(item => {
                        const badgeColor = item.complexidade === 'Alta' ? 'bg-red-500 text-white' : 'bg-blue-500 text-white';
                        tbody.append(`
                            <tr>
                                <td class="font-mono text-center font-bold text-blue-800 bg-blue-50 rounded">${item.codigo_sigtap}</td>
                                <td class="uppercase text-sm font-semibold">${item.descricao}</td>
                                <td class="text-center"><span class="px-3 py-1 rounded-full text-xs font-bold ${badgeColor} shadow-sm">${item.complexidade}</span></td>
                                <td class="font-bold text-right text-emerald-600 font-mono text-lg">R$ ${item.valor_unitario.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                            </tr>
                        `);
                    });
                } else {
                    $('#corpoTabela').append('<tr><td colspan="4" class="text-center py-6 text-gray-500">Nenhum procedimento encontrado no banco de dados.</td></tr>');
                }
                
                $('#tabelaFilaZero').DataTable({
                    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
                    pageLength: 20,
                    responsive: true,
                    order: [[1, 'asc']] // Ordena por nome
                });

            } catch (err) {
                console.error(err);
                $('#loading').html(`<div class="text-red-500"><i class="fas fa-exclamation-triangle text-3xl mb-2"></i><br>Erro de Permissão (RLS).<br><span class="text-sm">Vá ao SQL Editor do Supabase e rode: ALTER TABLE fila_zero_procedimentos DISABLE ROW LEVEL SECURITY;</span></div>`).show();
                $('#tabelaFilaZero').hide();
            }
        }
        
        carregarDados();
    </script>
</body>
</html>
