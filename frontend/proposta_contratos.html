<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Propostas - NII</title>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background: #001528; background-image: linear-gradient(135deg, #001528 0%, #002244 100%); background-attachment: fixed; color: white; margin: 0; min-height: 100vh; padding-bottom: 90px; transition: 0.5s; }
        body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; pointer-events: none; }
        .blob-1 { position: fixed; top: -50px; left: -50px; width: 500px; height: 500px; background: rgba(56, 189, 248, 0.35); border-radius: 50%; filter: blur(120px); z-index: -1; pointer-events: none; }
        .header-bg { background: transparent; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 20px 40px; margin-bottom: 20px; }
        .cyber-container { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(16px); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 25px; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-top: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 20px; text-align: center; }
        .kpi-title { font-size: 0.75rem; text-transform: uppercase; color: #cbd5e1; font-weight: bold; margin-bottom: 5px; }
        .kpi-number { font-size: 2rem; font-weight: 900; }
        .btn-action { background: #0ea5e9; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; transition: 0.2s; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;}
        .btn-action:hover { background: #0284c7; transform: translateY(-2px); }
        .cart-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .cart-table th { background: rgba(0,0,0,0.3); padding: 10px; color: #38bdf8; font-size: 0.75rem; text-transform: uppercase; border-bottom: 2px solid rgba(56, 189, 248, 0.3); }
        .cart-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; vertical-align: middle; }
        .input-qtd { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 5px; border-radius: 6px; width: 60px; text-align: center; font-weight: bold; outline: none; }
        
        /* Sidebar de Histórico */
        #sidebar-historico { position: fixed; top: 0; right: -400px; width: 400px; height: 100%; background: #001528; border-left: 1px solid rgba(56, 189, 248, 0.3); z-index: 1000; transition: 0.4s; padding: 25px; box-shadow: -10px 0 30px rgba(0,0,0,0.5); overflow-y: auto; }
        #sidebar-historico.active { right: 0; }
        .prop-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 12px; cursor: pointer; transition: 0.2s; }
        .prop-item:hover { background: rgba(56, 189, 248, 0.1); border-color: #38bdf8; }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .cyber-container { border: none !important; box-shadow: none !important; }
            .cart-table th { background: #f0f0f0 !important; color: black !important; border-bottom: 2px solid black !important; }
            .cart-table td { border-bottom: 1px solid #ccc !important; }
        }
    </style>
</head>
<body>

    <div id="loader" style="display:none; position: fixed; inset: 0; background: rgba(0,21,40,0.9); z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
        <i class="fas fa-sync fa-spin text-5xl text-blue-400 mb-4"></i>
        <p class="text-white font-bold" id="loader-text">Processando...</p>
    </div>

    <div id="sidebar-historico">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-bold text-blue-400"><i class="fas fa-history mr-2"></i> Minhas Propostas</h3>
            <button onclick="toggleHistorico()" class="text-white hover:text-red-500"><i class="fas fa-times text-2xl"></i></button>
        </div>
        <div id="lista-propostas">
            <p class="text-gray-500 text-center py-10">Buscando propostas...</p>
        </div>
    </div>

    <div class='header-bg shadow-lg no-print'>
        <div class='max-w-[98%] mx-auto flex justify-between items-center px-4'>
            <div class="flex items-center gap-4">
                <div class="bg-white/10 border border-white/20 p-3 rounded-lg"><i class="fa-solid fa-file-signature text-3xl text-emerald-400"></i></div>
                <div>
                    <h1 class='text-2xl font-bold'>Gerador de Propostas</h1>
                    <p class='text-xs opacity-70'>Salve, edite e exporte suas metas contratuais</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="novaProposta()" class="btn-action bg-gray-600 hover:bg-gray-700"><i class="fas fa-file"></i> Novo</button>
                <button onclick="salvarProposta()" class="btn-action bg-blue-600 hover:bg-blue-700"><i class="fas fa-save"></i> Salvar Proposta</button>
                <button onclick="toggleHistorico()" class="btn-action bg-purple-600 hover:bg-purple-700"><i class="fas fa-folder-open"></i> Abrir Salvas</button>
                <button onclick="window.print()" class="btn-action bg-orange-500 hover:bg-orange-600"><i class="fas fa-print"></i> Imprimir</button>
                <a href="modulo_gerencial.html" class="btn-theme p-3 rounded-lg bg-black/20 border border-white/10"><i class="fas fa-arrow-left"></i></a>
            </div>
        </div>
    </div>

    <div class="max-w-[98%] mx-auto px-4">
        
        <div class="mb-6 no-print">
            <label class="text-xs font-bold text-gray-400 uppercase">Nome da Proposta:</label>
            <input type="text" id="prop-titulo" placeholder="Ex: Proposta Mutirão de Cirurgias - Abril/2026" class="w-full bg-black/30 border border-white/10 p-3 rounded-lg text-xl font-bold text-emerald-400 outline-none focus:border-emerald-500">
            <input type="hidden" id="prop-id">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="glass-card"><div class="kpi-title">Qtd Total</div><div class="kpi-number text-blue-400" id="kpi-qtd">0</div></div>
            <div class="glass-card"><div class="kpi-title">Total SIGTAP</div><div class="kpi-number text-emerald-400" id="kpi-sigtap">R$ 0,00</div></div>
            <div class="glass-card"><div class="kpi-title">Total FILA ZERO</div><div class="kpi-number text-orange-400" id="kpi-fz">R$ 0,00</div></div>
            <div class="glass-card"><div class="kpi-title">Diferença</div><div class="kpi-number text-purple-400" id="kpi-diff">R$ 0,00</div></div>
        </div>

        <div class="cyber-container no-print">
            <div class="flex flex-col md:flex-row gap-4 items-end">
                <div class="flex-1 w-full">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Adicionar Procedimento</label>
                    <select id="select-procedimento" class="w-full"></select>
                </div>
                <div class="w-48">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Complexidade</label>
                    <select id="input-complexidade" class="w-full bg-black/40 border border-white/20 p-2 rounded-lg text-sm h-[42px]">
                        <option value="MEDIA">Média Complexidade</option>
                        <option value="ALTA">Alta Complexidade</option>
                    </select>
                </div>
                <div class="w-24">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2">Qtd</label>
                    <input type="number" id="input-qtd-add" value="1" min="1" class="input-qtd h-[42px] w-full text-lg">
                </div>
                <button onclick="adicionarAoCarrinho()" class="btn-action h-[42px] px-8"><i class="fas fa-plus"></i></button>
            </div>
        </div>

        <div class="cyber-container">
            <div class="overflow-x-auto">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th style="width: 12%;">Código</th>
                            <th style="width: 35%;">Procedimento</th>
                            <th style="width: 8%;" class="text-center">Meta</th>
                            <th style="width: 11%;" class="text-right">Unit. SIGTAP</th>
                            <th style="width: 11%;" class="text-right">Unit. F. Zero</th>
                            <th style="width: 10%;" class="text-right">Total SIGTAP</th>
                            <th style="width: 10%;" class="text-right">Total F. Zero</th>
                            <th style="width: 3%;" class="text-center no-print"></th>
                        </tr>
                    </thead>
                    <tbody id="tbody-proposta"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://voweywtzoldwfhgkniup.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvd2V5d3R6b2xkd2ZoZ2tuaXVwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODEwMTU5NSwiZXhwIjoyMDgzNjc3NTk1fQ.deftZEa4j3SFFsNNjVhU4cE67CGi1rVQSBAltz-AmPk';
        const client = window.supabase.createClient(SB_URL, SB_KEY);

        let catalogoGlobal = {}; 
        let propostaCarrinho = []; 
        const formatBrl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

        $(document).ready(function() { carregarCatalogos(); });

        async function carregarCatalogos() {
            $('#loader').css('display', 'flex');
            try {
                const { data: sigtap } = await client.from('sigtap_oficial').select('codigo, nome, valor_hospitalar, valor_profissional');
                const { data: fz } = await client.from('fila_zero_procedimentos').select('codigo_sigtap, valor_unitario');
                let mapFZ = {}; if (fz) fz.forEach(f => mapFZ[f.codigo_sigtap] = Number(f.valor_unitario || 0));

                let options = '<option value="">Buscar...</option>';
                sigtap.forEach(item => {
                    let totalSig = Number(item.valor_hospitalar || 0) + Number(item.valor_profissional || 0);
                    catalogoGlobal[item.codigo] = { nome: item.nome, val_sigtap: totalSig, val_fz: mapFZ[item.codigo] || 0 };
                    options += `<option value="${item.codigo}">${item.codigo} - ${item.nome}</option>`;
                });
                $('#select-procedimento').html(options).select2();
            } finally { $('#loader').hide(); }
        }

        function toggleHistorico() { 
            $('#sidebar-historico').toggleClass('active'); 
            if($('#sidebar-historico').hasClass('active')) buscarPropostasSalvas();
        }

        function novaProposta() {
            if(!confirm("Deseja limpar a tela e iniciar uma nova proposta?")) return;
            propostaCarrinho = []; $('#prop-id').val(''); $('#prop-titulo').val(''); renderizarTabelaProposta();
        }

        function adicionarAoCarrinho() {
            let cod = $('#select-procedimento').val();
            let comp = $('#input-complexidade').val();
            let qtd = parseInt($('#input-qtd-add').val()) || 1;
            if (!cod) return;
            let ext = propostaCarrinho.find(i => i.codigo === cod && i.complexidade === comp);
            if (ext) ext.qtd += qtd; else propostaCarrinho.push({ codigo: cod, complexidade: comp, qtd: qtd });
            renderizarTabelaProposta();
        }

        async function salvarProposta() {
            let titulo = $('#prop-titulo').val();
            let id = $('#prop-id').val();
            if (!titulo) return alert("Dê um nome para a proposta antes de salvar!");
            if (propostaCarrinho.length === 0) return alert("Adicione itens à proposta!");

            $('#loader').css('display', 'flex'); $('#loader-text').text("Salvando no Supabase...");
            
            let obj = {
                titulo: titulo,
                itens_json: propostaCarrinho,
                valor_total_sigtap: parseFloat($('#kpi-sigtap').text().replace(/\D/g,''))/100,
                valor_total_fz: parseFloat($('#kpi-fz').text().replace(/\D/g,''))/100,
                qtd_total: parseInt($('#kpi-qtd').text()),
                atualizado_em: new Date()
            };

            try {
                let res;
                if (id) res = await client.from('propostas_contratos').update(obj).eq('id', id);
                else res = await client.from('propostas_contratos').insert([obj]).select();
                
                if (res.error) throw res.error;
                if (!id) $('#prop-id').val(res.data[0].id);
                alert("✅ Proposta salva com sucesso!");
            } catch(e) { console.error(e); alert("Erro ao salvar."); }
            finally { $('#loader').hide(); }
        }

        async function buscarPropostasSalvas() {
            const { data } = await client.from('propostas_contratos').select('*').order('atualizado_em', { ascending: false });
            let html = '';
            data.forEach(p => {
                html += `<div class="prop-item" onclick="carregarProposta('${p.id}')">
                    <div class="font-bold text-emerald-400">${p.titulo}</div>
                    <div class="text-xs text-gray-400 mt-1">${new Date(p.atualizado_em).toLocaleDateString()} - ${p.qtd_total} itens</div>
                    <div class="text-xs font-bold text-orange-400 mt-1">Total FZ: ${formatBrl.format(p.valor_total_fz)}</div>
                </div>`;
            });
            $('#lista-propostas').html(html || '<p class="text-center text-gray-500">Nenhuma salva.</p>');
        }

        async function carregarProposta(id) {
            const { data } = await client.from('propostas_contratos').select('*').eq('id', id).single();
            if (data) {
                propostaCarrinho = data.itens_json;
                $('#prop-id').val(data.id);
                $('#prop-titulo').val(data.titulo);
                renderizarTabelaProposta();
                toggleHistorico();
            }
        }

        function renderizarTabelaProposta() {
            const tbody = $('#tbody-proposta'); tbody.empty();
            let tQtd = 0, tSig = 0, tFz = 0;

            ['MEDIA', 'ALTA'].forEach(compx => {
                let list = propostaCarrinho.filter(i => i.complexidade === compx);
                if (list.length === 0) return;
                tbody.append(`<tr class="bg-blue-900/30"><td colspan="8" class="p-2 text-xs font-bold text-blue-300">COMPLEXIDADE: ${compx}</td></tr>`);
                list.forEach(item => {
                    let info = catalogoGlobal[item.codigo];
                    let sSig = info.val_sigtap * item.qtd, sFz = info.val_fz * item.qtd;
                    tQtd += item.qtd; tSig += sSig; tFz += sFz;
                    tbody.append(`<tr>
                        <td class="font-mono text-cyan-400">${item.codigo}</td>
                        <td class="font-semibold">${info.nome}</td>
                        <td class="text-center"><input type="number" value="${item.qtd}" class="input-qtd no-print" onchange="atualizarQtd('${item.codigo}','${compx}',this.value)"></td>
                        <td class="text-right">${formatBrl.format(info.val_sigtap)}</td>
                        <td class="text-right text-orange-400">${formatBrl.format(info.val_fz)}</td>
                        <td class="text-right text-emerald-400 font-bold">${formatBrl.format(sSig)}</td>
                        <td class="text-right text-orange-400 font-bold">${formatBrl.format(sFz)}</td>
                        <td class="text-center no-print"><button onclick="remover('${item.codigo}','${compx}')" class="text-red-500"><i class="fas fa-trash"></i></button></td>
                    </tr>`);
                });
            });

            $('#kpi-qtd').text(tQtd); $('#kpi-sigtap').text(formatBrl.format(tSig)); $('#kpi-fz').text(formatBrl.format(tFz)); $('#kpi-diff').text(formatBrl.format(tFz - tSig));
        }

        function atualizarQtd(c, m, v) { let i = propostaCarrinho.find(x=>x.codigo===c && x.complexidade===m); if(i) i.qtd = parseInt(v); renderizarTabelaProposta(); }
        function remover(c, m) { propostaCarrinho = propostaCarrinho.filter(x=>!(x.codigo===c && x.complexidade===m)); renderizarTabelaProposta(); }
    </script>
</body>
</html>
