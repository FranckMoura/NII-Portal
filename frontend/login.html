<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NII Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* VARIÁVEIS DE TEMA (ENTERPRISE / SAAS DESIGN) */
        :root {
            --bg-body: #0f172a;       
            --bg-card: #1e293b;       
            --border-color: #334155;
            --text-main: #f8fafc;     
            --text-muted: #94a3b8;    
            --color-primary: #38bdf8; 
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        body.theme-classic {
            --bg-body: #f1f5f9;       
            --bg-card: #ffffff;       
            --border-color: #cbd5e1;  
            --text-main: #0f172a;     
            --text-muted: #64748b;    
            --color-primary: #004e92; 
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); 
            height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            margin: 0; position: relative; overflow: hidden; transition: 0.3s;
        }
        
        body:not(.theme-classic)::before { 
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); 
            background-size: 30px 30px; z-index: -1; pointer-events: none; 
        }
        
        .blob-1 { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(56, 189, 248, 0.15); border-radius: 50%; filter: blur(120px); z-index: -1; pointer-events: none; transition: 0.5s;}
        .blob-2 { position: fixed; bottom: -10%; right: -10%; width: 45vw; height: 45vw; background: rgba(168, 85, 247, 0.10); border-radius: 50%; filter: blur(100px); z-index: -1; pointer-events: none; transition: 0.5s;}
        body.theme-classic .blob-1, body.theme-classic .blob-2 { display: none; }
        
        .btn-theme-toggle { 
            position: absolute; top: 24px; right: 24px; background: var(--bg-card); color: var(--text-muted); 
            border: 1px solid var(--border-color); width: 42px; height: 42px; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; transition: 0.2s;
        }
        .btn-theme-toggle:hover { color: var(--text-main); border-color: var(--color-primary); }
        
        .login-card { 
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; 
            padding: 40px; width: 100%; max-width: 420px; text-align: center; position: relative; z-index: 2; 
            box-shadow: var(--shadow-card); transition: 0.3s;
        }

        /* CONTAINER DA LOGO - Ajustado para o tamanho exato da imagem */
        .login-logo-container { 
            position: relative; 
            display: inline-block; /* Ocupa apenas o tamanho da imagem */
            margin: 0 auto 25px auto; 
            height: 75px; 
        }
        
        .login-logo { 
            height: 100%; 
            width: auto; 
            position: relative; 
            z-index: 1; /* A imagem fica atrás */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); 
            transition: 0.3s;
        }
        
        /* CAIXA DO BATIMENTO CARDÍACO (POSICIONAMENTO EM PIXELS) */
        .ecg-wrapper {
            position: absolute; 
            z-index: 2; /* O batimento fica na frente */
            
            /* Ajuste FINO em pixels para centralizar dentro do coração da sua logo */
            bottom: 18px; /* Move para cima/baixo */
            left: 22px;   /* Move para esquerda/direita */
            
            width: 28px;  /* Tamanho reduzido para caber só no coração */
            height: 18px;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .ecg-svg { width: 100%; height: 100%; overflow: visible; }

        .ecg-svg path { 
            fill: none; 
            stroke: #10b981; /* Cor Verde */
            stroke-width: 3; 
            filter: drop-shadow(0 0 3px rgba(16, 185, 129, 0.8)); 
            stroke-dasharray: 40 60; 
            animation: monitorEcg 2.5s linear infinite; 
        }
        body.theme-classic .ecg-svg path { filter: none; stroke: var(--color-primary); }
        
        @keyframes monitorEcg { 0% { stroke-dashoffset: 100; } 100% { stroke-dashoffset: 0; } }
        
        .login-header h2 { margin: 0 0 5px 0; font-size: 1.5rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;}
        .login-header p { margin: 0 0 25px 0; color: var(--text-muted); font-size: 0.85rem; font-weight: 500;}
        
        .input-group { position: relative; margin-bottom: 16px; width: 100%; text-align: left; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        
        input { 
            width: 100%; padding: 12px 16px 12px 42px; background: rgba(0,0,0,0.1); color: var(--text-main); 
            border: 1px solid var(--border-color); border-radius: 8px; outline: none; transition: 0.2s; font-size: 0.95rem;
        }
        body.theme-classic input { background: #f8fafc; }
        input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        body.theme-classic input:focus { box-shadow: 0 0 0 3px rgba(0, 78, 146, 0.15); }
        
        button.btn-login { 
            width: 100%; padding: 14px; margin-top: 10px; background: var(--color-primary); color: #ffffff; 
            border: none; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; 
            align-items: center; gap: 10px; transition: 0.2s; font-size: 0.95rem; box-shadow: 0 4px 6px -1px rgba(56, 189, 248, 0.3);
        }
        button.btn-login:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
        body.theme-classic button.btn-login { box-shadow: 0 4px 6px -1px rgba(0, 78, 146, 0.3); }
        
        #msg { background-color: rgba(248, 113, 113, 0.1); color: #f87171; padding: 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; margin-top: 20px; display: none; border: 1px solid rgba(248, 113, 113, 0.3); }
        body.theme-classic #msg { background-color: #fef2f2; color: #dc2626; border-color: #fecdd3; }

        /* Acesso Público */
        .public-access { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .btn-public {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
            padding: 12px; background: transparent; border: 1px solid var(--border-color); border-radius: 8px;
            color: var(--text-muted); font-size: 0.85rem; font-weight: 700; text-decoration: none; transition: 0.2s;
        }
        .btn-public:hover { background: rgba(168, 85, 247, 0.1); color: #c084fc; border-color: #c084fc; }
        body.theme-classic .btn-public:hover { background: #f3e8ff; color: #7e22ce; border-color: #7e22ce; }
    </style>
</head>
<body>

    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <button onclick="toggleTheme()" id="btn-theme-toggle" class="btn-theme-toggle" title="Alternar Tema">
        <i class="fas fa-sun" id="theme-icon"></i>
    </button>

    <div class="login-card">
        <div class="login-header">
            
            <div class="login-logo-container">
                <img src="../logo.png" alt="Hospital Santa Helena" class="login-logo" onerror="this.src='https://voweywtzoldwfhgkniup.supabase.co/storage/v1/object/public/arquivos-faturamento/logo.png'">
                
                <div class="ecg-wrapper">
                    <svg viewBox="0 0 100 20" class="ecg-svg" preserveAspectRatio="none">
                        <path d="M 0,10 L 16,10 L 18,3 L 21,18 L 24,2 L 27,15 L 30,10 L 100,10" pathLength="100"></path>
                    </svg>
                </div>
            </div>

            <h2>Portal NII</h2>
            <p>Entre com suas credenciais de acesso</p>
        </div>

        <div class="input-group">
            <label>E-mail Corporativo</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="usuario@santahelena.com">
            </div>
        </div>
        
        <div class="input-group">
            <label>Senha</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="senha" placeholder="••••••••" onkeypress="if(event.keyCode==13) fazerLogin()">
            </div>
        </div>

        <button onclick="fazerLogin()" id="btnLogin" class="btn-login"><i class="fas fa-sign-in-alt"></i> Acessar Sistema</button>
        <div id="msg"><i class="fas fa-exclamation-circle mr-1"></i> <span id="msg-text"></span></div>

        <div class="public-access">
            <a href="painel_ferramentas_standalone.html" class="btn-public">
                <i class="fas fa-toolbox text-lg"></i> Ferramentas e Consultas (Acesso Livre)
            </a>
        </div>
    </div>

    <script>
        const SB_URL = 'https://voweywtzoldwfhgkniup.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvd2V5d3R6b2xkd2ZoZ2tuaXVwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODEwMTU5NSwiZXhwIjoyMDgzNjc3NTk1fQ.deftZEa4j3SFFsNNjVhU4cE67CGi1rVQSBAltz-AmPk';
        
        const client = window.supabase.createClient(SB_URL, SB_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        // Verifica Sessão Ativa
        client.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.replace('index_v2.html');
        });

        async function fazerLogin() {
            const email = $('#email').val();
            const password = $('#senha').val();
            const btn = $('#btnLogin');
            
            if (!email || !password) {
                mostrarErro("Preencha todos os campos.");
                return;
            }

            btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Verificando...');
            $('#msg').hide();

            try {
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (error) throw error;

                if (data.session) {
                    btn.html('<i class="fas fa-check-circle"></i> Sucesso! Entrando...').css('background', '#10b981');
                    setTimeout(() => { window.location.replace("index_v2.html"); }, 600);
                }
            } catch (e) {
                mostrarErro("E-mail ou senha incorretos.");
                btn.prop('disabled', false).html('<i class="fas fa-sign-in-alt"></i> Acessar Sistema').css('background', '');
            }
        }

        function mostrarErro(t) { $('#msg-text').text(t); $('#msg').show(); }
        
        function toggleTheme() { 
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (body.classList.contains('theme-classic')) {
                body.classList.remove('theme-classic');
                localStorage.setItem('nii_theme_hub', 'neon');
                icon.className = 'fas fa-sun';
            } else {
                body.classList.add('theme-classic');
                localStorage.setItem('nii_theme_hub', 'classic');
                icon.className = 'fas fa-moon';
            }
        }
        
        $(document).ready(function() {
            if(localStorage.getItem('nii_theme_hub') === 'classic') {
                $('body').addClass('theme-classic');
                $('#theme-icon').removeClass('fa-sun').addClass('fa-moon');
            }
        });
    </script>
</body>
</html>
