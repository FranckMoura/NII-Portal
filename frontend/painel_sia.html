<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Ambulatorial SIA - NII Portal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; background: #001528; background-image: linear-gradient(135deg, #001528 0%, #002244 100%); color: white; min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .kpi-title { font-size: 0.75rem; text-transform: uppercase; color: #cbd5e1; font-weight: bold; margin-bottom: 8px; }
        .kpi-number { font-size: 1.6rem; font-weight: 900; line-height: 1.1; }
        
        table.dataTable { color: white !important; }
        table.dataTable thead th { border-bottom: 1px solid rgba(56, 189, 248, 0.3) !important; color: #38bdf8 !important; }
        table.dataTable tbody td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .dataTables_filter input, .dataTables_length select { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 6px; }
        .dt-button { background: rgba(16, 185, 129, 0.2) !important; color: #34d399 !important; border: 1px solid rgba(16, 185, 129, 0.4) !important; border-radius: 6px !important; }
    </style>
</head>
<body class="p-6">

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class='text-3xl font-bold text-white'><i class="fa-solid fa-stethoscope text-sky-400 mr-2"></i>Produção Ambulatorial (SIA)</h1>
            <p class='text-cyan-200 text-sm mt-1'>Hospital Beneficente Santa Helena</p>
        </div>
        <div class="flex items-end gap-3">
            <div>
                <label class="text-xs text-gray-400 block mb-1">Competência (Ano)</label>
                <select id="filtroAno" class="bg-black/40 border border-white/20 rounded px-4 py-2 text-white outline-none">
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-gray-400 block mb-1">Mês</label>
                <select id="filtroMes" class="bg-black/40 border border-white/20 rounded px-4 py-2 text-white outline-none">
                    <option value="">Todos</option>
                    <option value="01">01</option><option value="02">02</option><option value="03">03</option>
                    <option value="04">04</option><option value="05" selected>05</option><option value="06">06</option>
                </select>
            </div>
            <button onclick="carregarSIA()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg"><i class="fas fa-bolt mr-2"></i> Atualizar</button>
            <a href="modulo_estrategico.html" class="bg-gray-700 text-white px-4 py-2 rounded-lg font-bold">Voltar</a>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="glass-card p-5 text-center border-b-4 border-emerald-500">
            <div class="kpi-title"><i class="fas fa-file-invoice-dollar text-emerald-400 mr-1"></i> Total Faturado Aprovado</div>
            <div class="kpi-number text-emerald-400" id="kpi-valor">R$ 0,00</div>
        </div>
        <div class="glass-card p-5 text-center border-b-4 border-sky-500">
            <div class="kpi-title"><i class="fas fa-list text-sky-400 mr-1"></i> Quantidade de Procedimentos</div>
            <div class="kpi-number text-sky-400" id="kpi-qtd">0</div>
        </div>
        <div class="glass-card p-5 text-center border-b-4 border-pink-500">
            <div class="kpi-title"><i class="fas fa-users text-pink-400 mr-1"></i> Média de Idade (Anos)</div>
            <div class="kpi-number text-pink-400" id="kpi-idade">0</div>
        </div>
    </div>

    <div class="glass-card p-5 mb-8">
        <h3 class="text-lg font-bold text-sky-400 mb-4"><i class="fas fa-table mr-2"></i>Relação de Produção BPA/APAC</h3>
        <table id="tabela-sia" class="display w-full" style="width:100%">
            <thead><tr><th>Procedimento</th><th>CBO</th><th>CID-10</th><th>Idade</th><th>Qtd Aprovada</th><th>Valor (R$)</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const sbUrl = 'https://voweywtzoldwfhgkniup.supabase.co';
        const sbKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvd2V5d3R6b2xkd2ZoZ2tuaXVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxMDE1OTUsImV4cCI6MjA4MzY3NzU5NX0.aLtDv7A7_k41ag2CCQDb-PYcOE6UxJqhyl_g_PVtKl0';
        const db = window.supabase.createClient(sbUrl, sbKey);

        let dtTable = null;
        const fmtMoeda = v => parseFloat(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

        async function carregarSIA() {
            const ano = $('#filtroAno').val();
            const mes = $('#filtroMes').val();
            
            $('#kpi-valor').html('<i class="fas fa-spinner fa-spin text-sm"></i>');
            $('#kpi-qtd').html('-');
            $('#kpi-idade').html('-');

            let query = db.from('sia_sus_hsh').select('*').eq('ano_cmpt', ano);
            if(mes) query = query.eq('mes_cmpt', mes);
            
            const { data, error } = await query.limit(5000);
            
            if(error) { alert("Erro de conexão"); return; }
            if(!data || data.length === 0) {
                $('#kpi-valor').text("R$ 0,00"); $('#tabela-sia tbody').empty(); return;
            }

            let totalValor = 0; let totalQtd = 0; let somaIdade = 0;
            let htmlTr = '';

            data.forEach(d => {
                const val = parseFloat(d.pa_val_pro || 0);
                const qtd = parseFloat(d.pa_qtd_pro || 1);
                const idade = parseFloat(d.pa_idade || 0);

                totalValor += val;
                totalQtd += qtd;
                somaIdade += idade;

                htmlTr += `<tr>
                    <td class="font-mono text-sky-200 text-sm">${d.pa_proc_id || '-'}</td>
                    <td class="text-sm text-gray-400">${d.pa_cbo_prof || '-'}</td>
                    <td class="font-bold text-pink-300 text-sm">${d.pa_cidpri || '-'}</td>
                    <td class="text-center">${idade}</td>
                    <td class="text-center font-bold text-white">${qtd}</td>
                    <td class="text-right font-bold text-green-400">${fmtMoeda(val)}</td>
                </tr>`;
            });

            $('#kpi-valor').text(fmtMoeda(totalValor));
            $('#kpi-qtd').text(totalQtd.toLocaleString('pt-BR'));
            $('#kpi-idade').text(Math.round(somaIdade / data.length));

            if(dtTable) dtTable.destroy();
            $('#tabela-sia tbody').html(htmlTr);
            dtTable = $('#tabela-sia').DataTable({ 
                language: { url: 'https://cdn.datatables.net/plug-ins/1.13.7/i18n/pt-PT.json' }, 
                pageLength: 15, responsive: true, dom: 'Bfrtip', 
                buttons: [{ extend: 'excelHtml5', text: '<i class="fas fa-file-excel"></i> Exportar', className: 'dt-button' }] 
            });
        }
        $(document).ready(carregarSIA);
    </script>
</body>
</html>
