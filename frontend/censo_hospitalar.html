<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo Hospitalar - NII Analytics</title>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #001528; 
            background-image: linear-gradient(135deg, #001528 0%, #002244 100%); 
            color: white; 
            min-height: 100vh; 
        }
        
        /* Padrão NII: Containers Cyber */
        .cyber-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(16px); 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .kpi-card {
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid transparent;
        }

        /* Status dos Leitos */
        .bed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .bed-card {
            padding: 15px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .bed-card:hover { transform: translateY(-3px); }

        .bed-occupied { border-left: 5px solid #38bdf8; }
        .bed-alert { 
            border-left: 5px solid #f43f5e; 
            background: rgba(244, 63, 94, 0.05);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { border-left-color: #f43f5e; }
            50% { border-left-color: #fb7185; }
            100% { border-left-color: #f43f5e; }
        }

        .badge-aih {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Tema Clássico */
        body.theme-classic { background: #f8fafc; color: #0f172a; }
        body.theme-classic .cyber-card { background: white; border-color: #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        body.theme-classic .bed-card { background: #f1f5f9; border-color: #cbd5e1; color: #1e293b; }
        body.theme-classic .text-blue-400 { color: #2563eb; }

        /* Loader */
        #loader {
            position: fixed; inset: 0; background: #001528; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="loader">
        <i class="fas fa-circle-notch fa-spin text-4xl text-blue-400 mb-4"></i>
        <p class="text-blue-200 animate-pulse">Sincronizando com SOULMV...</p>
    </div>

    <div class="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight">Censo Hospitalar <span class="text-blue-400 text-lg font-normal">| NII Intelligence</span></h1>
            <p class="text-blue-200 opacity-70">Monitoramento de Leitos e Auditoria de AIH em Tempo Real</p>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTheme()" class="p-3 cyber-card hover:bg-white/10"><i class="fas fa-magic"></i></button>
            <button onclick="carregarCenso()" class="p-3 cyber-card hover:bg-white/10 text-emerald-400"><i class="fas fa-sync-alt"></i> Atualizar</button>
            <a href="index_v2.html" class="p-3 cyber-card hover:bg-white/10"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>
    </div>

    <main class="max-w-7xl mx-auto">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="cyber-card kpi-card">
                <p class="text-xs uppercase text-gray-400 font-bold">Taxa de Ocupação</p>
                <h2 class="text-3xl font-black text-blue-400" id="kpi-taxa">0%</h2>
            </div>
            <div class="cyber-card kpi-card">
                <p class="text-xs uppercase text-gray-400 font-bold">Total Internados</p>
                <h2 class="text-3xl font-black text-white" id="kpi-total">0</h2>
            </div>
            <div class="cyber-card kpi-card border-b-rose-500">
                <p class="text-xs uppercase text-rose-400 font-bold">AIHs Pendentes</p>
                <h2 class="text-3xl font-black text-rose-500" id="kpi-pendentes">0</h2>
            </div>
            <div class="cyber-card kpi-card">
                <p class="text-xs uppercase text-gray-400 font-bold">Média Permanência</p>
                <h2 class="text-3xl font-black text-orange-400" id="kpi-media">0 <span class="text-sm font-normal">dias</span></h2>
            </div>
        </div>

        <div class="cyber-card p-4 mb-8 flex flex-wrap gap-4 items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-filter text-blue-400"></i>
                <span class="text-sm font-bold uppercase">Filtrar Ala:</span>
            </div>
            <select id="filter-ala" onchange="renderizarLeitos()" class="bg-black/20 border border-white/10 rounded px-3 py-1 text-sm outline-none">
                <option value="TODAS">Todas as Alas</option>
            </select>
            <select id="filter-status" onchange="renderizarLeitos()" class="bg-black/20 border border-white/10 rounded px-3 py-1 text-sm outline-none">
                <option value="TODOS">Todos os Status</option>
                <option value="ALERTA">Apenas Sem AIH</option>
                <option value="OK">Apenas Com AIH</option>
            </select>
        </div>

        <div id="censo-container">
            </div>

    </main>

    <script>
        const SB_URL = "https://voweywtzoldwfhgkniup.supabase.co/";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvd2V5d3R6b2xkd2ZoZ2tuaXVwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODEwMTU5NSwiZXhwIjoyMDgzNjc3NTk1fQ.deftZEa4j3SFFsNNjVhU4cE67CGi1rVQSBAltz-AmPk";
        const client = supabase.createClient(SB_URL, SB_KEY);

        let dadosCenso = [];
        const TOTAL_LEITOS_HOSPITAL = 150; // Ajuste para o número real do Santa Helena

        async function carregarCenso() {
            $('#loader').fadeIn();
            try {
                // Buscamos apenas quem está internado (Status 'S')
                const { data, error } = await client
                    .from('atendimentos_mv')
                    .select('*')
                    .eq('status_internado', 'S');

                if (error) throw error;
                dadosCenso = data;
                
                popularFiltroAlas();
                atualizarKPIs();
                renderizarLeitos();
            } catch (err) {
                console.error("Erro ao carregar censo:", err);
                alert("Erro ao sincronizar dados. Verifique sua conexão.");
            } finally {
                $('#loader').fadeOut();
            }
        }

        function popularFiltroAlas() {
            const alas = [...new Set(dadosCenso.map(d => definirAla(d.leito_atual)))];
            const select = $('#filter-ala');
            select.html('<option value="TODAS">Todas as Alas</option>');
            alas.sort().forEach(ala => {
                select.append(`<option value="${ala}">${ala}</option>`);
            });
        }

        // Regra de Negócio: Define a Ala pelo número do leito (Ajuste conforme a realidade do HSH)
        function definirAla(leito) {
            if (!leito) return "NÃO INFORMADO";
            const num = parseInt(leito);
            if (num >= 300 && num <= 350) return "UTI ADULTO";
            if (num >= 40 && num <= 150) return "MATERNIDADE / ALOJAMENTO";
            if (num < 40) return "ENFERMARIA CLÍNICA";
            return "OUTROS SETORES";
        }

        function atualizarKPIs() {
            const total = dadosCenso.length;
            const semAih = dadosCenso.filter(d => !d.numero_aih || d.numero_aih.trim() === "").length;
            const taxa = ((total / TOTAL_LEITOS_HOSPITAL) * 100).toFixed(1);
            
            // Cálculo simples de permanência (Data Internação vs Hoje)
            let somaDias = 0;
            dadosCenso.forEach(d => {
                const partes = d.data_internacao.split(' ')[0].split('.');
                const dataIni = new Date(partes[2], partes[1]-1, partes[0]);
                const diff = Math.floor((new Date() - dataIni) / (1000 * 60 * 60 * 24));
                somaDias += diff > 0 ? diff : 0;
            });
            const media = total > 0 ? (somaDias / total).toFixed(1) : 0;

            $('#kpi-total').text(total);
            $('#kpi-taxa').text(taxa + '%');
            $('#kpi-pendentes').text(semAih);
            $('#kpi-media').html(`${media} <span class="text-sm font-normal">dias</span>`);
        }

        function renderizarLeitos() {
            const alaFiltro = $('#filter-ala').val();
            const statusFiltro = $('#filter-status').val();
            const container = $('#censo-container');
            container.empty();

            // Agrupa por Ala
            const alasAgrupadas = {};
            dadosCenso.forEach(d => {
                const ala = definirAla(d.leito_atual);
                
                // Aplica Filtros
                if (alaFiltro !== "TODAS" && ala !== alaFiltro) return;
                
                const temAih = d.numero_aih && d.numero_aih.trim() !== "";
                if (statusFiltro === "ALERTA" && temAih) return;
                if (statusFiltro === "OK" && !temAih) return;

                if (!alasAgrupadas[ala]) alasAgrupadas[ala] = [];
                alasAgrupadas[ala].push(d);
            });

            // Cria as Seções de Alas
            Object.keys(alasAgrupadas).sort().forEach(alaNome => {
                const pacientes = alasAgrupadas[alaNome];
                let alaHtml = `
                    <div class="mb-10">
                        <h3 class="text-lg font-bold text-blue-400 mb-4 border-l-4 border-blue-400 pl-3 flex justify-between">
                            ${alaNome} 
                            <span class="text-xs bg-blue-500/20 text-blue-300 px-2 py-1 rounded">${pacientes.length} Pacientes</span>
                        </h3>
                        <div class="bed-grid">
                `;

                pacientes.forEach(p => {
                    const semAih = !p.numero_aih || p.numero_aih.trim() === "";
                    const classAlerta = semAih ? 'bed-alert' : 'bed-occupied';
                    
                    // Cálculo de permanência para o card
                    const partes = p.data_internacao.split(' ')[0].split('.');
                    const dataIni = new Date(partes[2], partes[1]-1, partes[0]);
                    const dias = Math.floor((new Date() - dataIni) / (1000 * 60 * 60 * 24));

                    alaHtml += `
                        <div class="bed-card ${classAlerta}">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xl font-black text-white/50">#${p.leito_atual}</span>
                                <span class="badge-aih ${semAih ? 'bg-rose-500 text-white' : 'bg-emerald-500/20 text-emerald-400'}">
                                    ${semAih ? 'Sem AIH' : 'Com AIH'}
                                </span>
                            </div>
                            <h4 class="text-xs font-bold truncate mb-1" title="${p.nome_paciente}">${p.nome_paciente}</h4>
                            <p class="text-[10px] text-gray-400"><i class="far fa-clock"></i> Internado há ${dias} dias</p>
                            <p class="text-[10px] text-gray-500 mt-2 truncate"><i class="fas fa-user-md"></i> ${p.medico_responsavel || 'Não inf.'}</p>
                            ${!semAih ? `<p class="text-[9px] text-blue-400 font-mono mt-1">${p.numero_aih}</p>` : ''}
                        </div>
                    `;
                });

                alaHtml += `</div></div>`;
                container.append(alaHtml);
            });

            if (Object.keys(alasAgrupadas).length === 0) {
                container.html('<div class="text-center py-20 opacity-50"><i class="fas fa-bed text-5xl mb-4"></i><p>Nenhum paciente encontrado com este filtro.</p></div>');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('theme-classic');
        }

        // Início
        $(document).ready(() => carregarCenso());
    </script>
</body>
</html>
