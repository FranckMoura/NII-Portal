<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Financeiro - NII</title>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* TEMA GLOBAL DARK NEON E CLASSIC */
        body { font-family: 'Inter', sans-serif; background: #001528; background-image: linear-gradient(135deg, #001528 0%, #002244 100%); background-attachment: fixed; color: white; padding: 0; margin: 0; min-height: 100vh; padding-bottom: 40px; transition: background 0.5s ease, color 0.5s ease; }
        body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; pointer-events: none; }
        .header-bg { background: transparent; padding: 30px 0 60px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 30px; transition: 0.5s; }
        .header-mini-logo { height: 50px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); transition: transform 0.3s; }
        .header-print { display: none; }
        .btn-theme { background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; outline: none; }
        .btn-theme:hover { background: rgba(255,255,255,0.1); transform: scale(1.05);}
        .module-nav { display: flex; gap: 8px; margin-top: -45px; padding: 0 20px; align-items: flex-end; position: relative; z-index: 10;}
        .module-tab { padding: 14px 30px; background: rgba(0, 0, 0, 0.4); border-radius: 12px 12px 0 0; color: #94a3b8; cursor: pointer; font-weight: 600; font-size: 1rem; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.05); border-bottom: none; backdrop-filter: blur(5px); }
        .module-tab:hover { background: rgba(56, 189, 248, 0.1); color: white; }
        .module-tab.active { background: rgba(255,255,255,0.05); color: #38bdf8; border-color: rgba(56,189,248,0.5); font-weight: 800; padding-bottom: 18px; box-shadow: 0 -4px 10px rgba(0,0,0,0.3); border-bottom: 2px solid transparent; }
        .view-section { display: none; animation: fadeIn 0.3s; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .filter-area { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 30px rgba(0,0,0,0.1); padding: 20px; transition: 0.5s; }
        .filter-area select, .filter-area input { background: rgba(0,0,0,0.4); color: white; border: 1px solid rgba(255,255,255,0.2); outline: none; border-radius: 6px; padding: 5px; }
        .filter-area select option { background: #0f172a; color: white; }
        .card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 25px; transition: 0.4s; }
        .border-blue-500 { border-left: 4px solid #38bdf8 !important; }
        .border-orange-500 { border-left: 4px solid #fbbf24 !important; }
        .border-green-500 { border-left: 4px solid #34d399 !important; }
        .card h3 { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #cbd5e1; }
        .table-container { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 25px; }
        table.dataTable { color: white !important;}
        table.dataTable thead th { background-color: rgba(0, 0, 0, 0.2) !important; color: #38bdf8 !important; border: none !important; border-bottom: 1px solid rgba(56, 189, 248, 0.3) !important;}
        table.dataTable tbody td { border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #cbd5e1; }
        
        body.theme-classic { background: #f3f4f6 !important; color: #1e293b !important; }
        body.theme-classic::before { display: none; }
        body.theme-classic .header-bg { background: linear-gradient(135deg, #000428 0%, #004e92 100%) !important; }
        body.theme-classic .module-tab.active { background: #f3f4f6 !important; color: #004e92 !important; border-top: 4px solid #004e92 !important; }
        body.theme-classic .filter-area, body.theme-classic .card, body.theme-classic .table-container { background: #ffffff !important; border: 1px solid #e2e8f0 !important; }
        body.theme-classic .filter-area select, body.theme-classic .filter-area input { background: #ffffff !important; color: #1e293b !important; border-color: #cbd5e1 !important; }
        body.theme-classic .card h3 { color: #475569 !important; }
        body.theme-classic table.dataTable { color: #334155 !important; }
        body.theme-classic table.dataTable thead th { background-color: #e2e8f0 !important; color: #1e293b !important; border-bottom: 1px solid #cbd5e1 !important; }
        body.theme-classic table.dataTable tbody td { border-bottom: 1px solid #e2e8f0 !important; color: #334155 !important;}
    </style>
</head>
<body>

    <div class='header-bg pb-12 no-print'>
        <div class='max-w-7xl mx-auto flex justify-between items-center px-4'>
            <div class="flex items-center gap-4">
                <div class="bg-white/10 border border-white/20 p-3 rounded-lg"><i class="fa-solid fa-coins text-3xl text-emerald-400"></i></div>
                <div>
                    <h1 class='text-3xl font-bold text-white'>Gestão Financeira</h1>
                    <p class='text-emerald-200 text-sm mt-1 opacity-80'>Portal NII - Repasses e Rateios</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="btn-theme"><i class="fas fa-magic"></i></button>
                <img src="../logo.png" class="header-mini-logo" onerror="this.style.display='none'">
            </div>
        </div>
    </div>

    <div class='max-w-7xl mx-auto module-nav no-print'>
        <div class="module-tab active" onclick="trocarModulo('medico')"><i class="fas fa-user-md mr-2"></i> Repasse Médico</div>
        <div class="module-tab" onclick="trocarModulo('terceiros')"><i class="fas fa-truck-medical mr-2"></i> Repasse Terceiros</div>
    </div>

    <div id="view-medico" class="view-section active max-w-7xl mx-auto px-4 mt-6">
        <div class='mb-6 filter-area flex gap-4 items-center'>
            <label class="font-bold text-sm uppercase">Competência:</label>
            <select id="selCompMedico" onchange="Medico.carregarDados()"></select>
            
            <label class="font-bold text-sm uppercase ml-4">Convênio:</label>
            <select id="selConvenioMedico" onchange="Medico.carregarDados()">
                <option value="PLANO UNICO">PLANO ÚNICO (Geral)</option>
                <option value="FILA ZERO">FILA ZERO</option>
            </select>
        </div>

        <div class='grid grid-cols-1 md:grid-cols-3 gap-6 mb-8'>
            <div class='card border-l-4 border-blue-500'>
                <h3>Receita Rateio (SP)</h3>
                <p class='text-2xl font-bold' id="card-med-rateio">R$ 0,00</p>
            </div>
            <div class='card border-l-4 border-orange-500'>
                <h3>Produção Geral</h3>
                <p class='text-2xl font-bold' id="card-med-prod">R$ 0,00</p>
            </div>
            <div class='card border-l-4 border-green-500'>
                <h3>Total a Repassar</h3>
                <p class='text-2xl font-bold' id="card-med-total">R$ 0,00</p>
            </div>
        </div>

        <div class="table-container mb-8">
            <table id='tblMedico' class="display w-full">
                <thead><tr><th>Profissional</th><th class="text-right">V. Rateio</th><th class="text-right">V. Prod. Geral</th><th class="text-center">TOTAL (R$)</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="view-terceiros" class="view-section max-w-7xl mx-auto px-4 mt-6">
        <div class='mb-6 filter-area flex flex-wrap gap-4 items-center'>
            <label class="font-bold text-sm uppercase">Competência:</label>
            <select id="selCompTerc" onchange="Terceiros.carregarDados()"></select>

            <label class="font-bold text-sm uppercase ml-4">Convênio:</label>
            <select id="selConvenioTerc" onchange="Terceiros.carregarDados()">
                <option value="PLANO UNICO">PLANO ÚNICO (Geral)</option>
                <option value="FILA ZERO">FILA ZERO</option>
            </select>
        </div>

        <div class='grid grid-cols-1 md:grid-cols-3 gap-6 mb-8'>
            <div class='card border-l-4 border-blue-500'>
                <h3>Faturamento Total</h3>
                <p class='text-2xl font-bold' id="card-terc-total">R$ 0,00</p>
            </div>
        </div>

        <div class="table-container mb-8">
            <table id='tblTerceiros' class="display w-full">
                <thead><tr><th>Grupo</th><th>Código</th><th>Descrição</th><th class="text-center">Qtd</th><th class="text-center">Valor Total</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const SB_URL = 'https://voweywtzoldwfhgkniup.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvd2V5d3R6b2xkd2ZoZ2tuaXVwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODEwMTU5NSwiZXhwIjoyMDgzNjc3NTk1fQ.deftZEa4j3SFFsNNjVhU4cE67CGi1rVQSBAltz-AmPk'; 
        const client = window.supabase.createClient(SB_URL, SB_KEY);
        const fmt = v => parseFloat(v).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});

        function toggleTheme() {
            const body = document.body;
            if (body.classList.contains('theme-classic')) {
                body.classList.remove('theme-classic'); localStorage.setItem('nii_theme_fin_int', 'neon');
            } else {
                body.classList.add('theme-classic'); localStorage.setItem('nii_theme_fin_int', 'classic');
            }
        }

        const commonDTConfig = (filename) => ({
            destroy: true, dom: 'lBrtip', pageLength: 25,
            buttons: [ { extend: 'excelHtml5', title: filename } ],
            language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json" }
        });

        function trocarModulo(modulo) {
            $('.view-section').removeClass('active'); $('#view-' + modulo).addClass('active');
            $('.module-tab').removeClass('active'); $(`.module-tab[onclick="trocarModulo('${modulo}')"]`).addClass('active');
            if(modulo === 'medico' && !Medico.carregado) Medico.init();
            if(modulo === 'terceiros' && !Terceiros.carregado) Terceiros.init();
        }

        $(document).ready(function() {
            if (localStorage.getItem('nii_theme_fin_int') === 'classic') document.body.classList.add('theme-classic');
            trocarModulo('medico');
        });

        const Medico = {
            carregado: false,
            init: async function() {
                const { data } = await client.from('financeiro_repasses').select('competencia');
                if(!data) return;
                const comps = [...new Set(data.map(i => i.competencia))].sort().reverse();
                const sel = $('#selCompMedico'); sel.empty();
                comps.forEach(c => sel.append(`<option value="${c}">${c}</option>`));
                if(comps.length > 0) this.carregarDados();
                this.carregado = true;
            },
            carregarDados: async function() {
                const comp = $('#selCompMedico').val();
                const conv = $('#selConvenioMedico').val();
                if(!comp) return;

                const { data } = await client.from('financeiro_repasses').select('*').eq('competencia', comp).eq('convenio', conv);
                if(!data) return;

                const totRateio = data.reduce((s, i) => s + (i.valor_rateio || 0), 0);
                const totProd = data.reduce((s, i) => s + (i.valor_prod_extra || 0), 0);
                const totGeral = totRateio + totProd;

                $('#card-med-rateio').text('R$ ' + fmt(totRateio));
                $('#card-med-prod').text('R$ ' + fmt(totProd));
                $('#card-med-total').text('R$ ' + fmt(totGeral));

                if ($.fn.DataTable.isDataTable('#tblMedico')) $('#tblMedico').DataTable().destroy();
                $('#tblMedico').DataTable({
                    ...commonDTConfig('Repasse_Medico'), data: data,
                    columns: [
                        { data: 'medico', className: 'font-bold' },
                        { data: 'valor_rateio', className: 'text-right font-mono', render: d => 'R$ ' + fmt(d) },
                        { data: 'valor_prod_extra', className: 'text-right font-mono', render: d => 'R$ ' + fmt(d) },
                        { data: 'valor_liquido', className: `text-center font-bold font-mono`, render: d => 'R$ ' + fmt(d) }
                    ]
                });
            }
        };

        const Terceiros = {
            carregado: false,
            init: async function() {
                const { data } = await client.from('financeiro_geral').select('competencia');
                if(!data) return;
                const comps = [...new Set(data.map(i => i.competencia))].sort().reverse();
                const sel = $('#selCompTerc'); sel.empty();
                comps.forEach(c => sel.append(`<option value="${c}">${c}</option>`));
                if(comps.length > 0) this.carregarDados();
                this.carregado = true;
            },
            carregarDados: async function() {
                const comp = $('#selCompTerc').val();
                const conv = $('#selConvenioTerc').val();
                if(!comp) return;

                const { data } = await client.from('financeiro_geral').select('*').eq('competencia', comp).eq('convenio', conv);
                if(!data) return;

                const totalGeral = data.reduce((s, i) => s + (i.valor_total || 0), 0);
                $('#card-terc-total').text('R$ ' + fmt(totalGeral));

                if ($.fn.DataTable.isDataTable('#tblTerceiros')) $('#tblTerceiros').DataTable().destroy();
                $('#tblTerceiros').DataTable({
                    ...commonDTConfig('Repasse_Terceiros'), data: data,
                    columns: [
                        { data: 'grupo', className: 'text-xs font-bold uppercase' },
                        { data: 'codigo', className: 'font-mono text-xs' },
                        { data: 'descricao' },
                        { data: 'qtd', className: 'text-center font-bold' },
                        { data: 'valor_total', className: `text-center font-bold font-mono`, render: d => 'R$ ' + fmt(d) }
                    ]
                });
            }
        };
    </script>
</body>
</html>
