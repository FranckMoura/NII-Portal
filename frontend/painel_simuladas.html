<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Auditoria - Simuladas</title>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; padding-bottom: 50px; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: white; padding: 20px 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .dt-button { background: #10b981 !important; color: white !important; border: none !important; border-radius: 6px !important; padding: 8px 16px !important; font-weight: bold !important; font-size: 0.8rem !important; margin-right: 8px !important; }
        .dt-button.buttons-print { background: #475569 !important; }
        .dt-button.buttons-excel { background: #0284c7 !important; }
        
        table.dataTable { width: 100% !important; }
        table.dataTable thead th { background-color: #1e293b !important; color: white !important; font-size: 0.75rem; text-transform: uppercase; padding: 10px 8px !important; border-bottom: none !important; white-space: nowrap; }
        table.dataTable tbody td { font-size: 0.75rem; color: #334155; vertical-align: middle; padding: 8px !important; border-bottom: 1px solid #f1f5f9; }
        table.dataTable tbody tr:hover { background-color: #f1f5f9 !important; }

        .loading { display: flex; justify-content: center; align-items: center; height: 200px; font-size: 1.2rem; color: #64748b; font-weight: bold; flex-direction: column; gap: 10px; }
        
        .tab-btn { padding: 12px 24px; font-weight: bold; font-size: 0.9rem; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; color: #64748b; background: none; border-top: none; border-left: none; border-right: none; outline: none; }
        .tab-btn:hover { color: #2563eb; }
        .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; background: #f8fafc; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class='header-bg'>
        <div class='max-w-7xl mx-auto flex justify-between items-center'>
            <div class="flex items-center gap-4">
                <div class="bg-white/20 p-3 rounded-lg"><i class="fa-solid fa-magnifying-glass-chart text-3xl"></i></div>
                <div>
                    <h1 class='text-2xl font-bold'>BI Simuladas - Auditoria de Dados</h1>
                    <p class='text-blue-200 text-sm'>Cruze dados, exporte relatórios e audite valores.</p>
                </div>
            </div>
            <div class="flex gap-4 items-center">
                <span class="text-sm font-bold uppercase text-blue-200">Mês do Arquivo:</span>
                <select id="filtroCompetencia" class="bg-white/20 text-white border border-white/30 rounded px-4 py-2 outline-none font-bold cursor-pointer">
                    <option value="02/2026" class="text-black">Competência: 02/2026</option>
                    <option value="01/2026" class="text-black">Competência: 01/2026</option>
                </select>
                <a href="modulo_estrategico.html" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded text-white font-bold transition flex items-center gap-2"><i class="fas fa-arrow-left"></i> Voltar</a>
            </div>
        </div>
    </div>

    <div class="max-w-[98%] mx-auto bg-white p-6 rounded-xl shadow-md border border-gray-200">
        
        <div class="flex border-b border-gray-200 mb-6">
            <button onclick="mudarAba('procedimentos')" id="btn-procedimentos" class="tab-btn active"><i class="fas fa-list-ol mr-2"></i> Procedimentos Lançados</button>
            <button onclick="mudarAba('valores')" id="btn-valores" class="tab-btn"><i class="fas fa-dollar-sign mr-2"></i> Valores Financeiros (Prévia)</button>
        </div>

        <div id="loader" class="loading">
            <i class="fas fa-circle-notch fa-spin text-3xl text-blue-600"></i>
            <span id="loading-text">Conectando ao banco de dados Supabase...</span>
        </div>
        
        <div id="aba-procedimentos" class="tab-content active w-full overflow-x-auto" style="opacity: 0;">
            <table id="tabelaProcedimentos" class="display w-full">
                <thead>
                    <tr>
                        <th>Pág</th>
                        <th>AIH</th>
                        <th>Paciente</th>
                        <th>Lnh</th>
                        <th>Código</th>
                        <th>Qtd</th>
                        <th>Cmpt</th>
                        <th>Documento/CNES</th>
                        <th>Descrição do Procedimento</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="aba-valores" class="tab-content w-full overflow-x-auto" style="opacity: 0;">
            <table id="tabelaValores" class="display w-full">
                <thead>
                    <tr>
                        <th>Pág</th>
                        <th>AIH</th>
                        <th>Paciente</th>
                        <th>Grupo / Procedimento Consolidado</th>
                        <th class="text-right">Valor Extraído (R$)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </div>

<script>
// Remove popups nativos de erro do datatables e loga silenciosamente
$.fn.dataTable.ext.errMode = 'none';

const SUPABASE_URL = "https://voweywtzoldwfhgkniup.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvd2V5d3R6b2xkd2ZoZ2tuaXVwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODEwMTU5NSwiZXhwIjoyMDgzNjc3NTk1fQ.deftZEa4j3SFFsNNjVhU4cE67CGi1rVQSBAltz-AmPk";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let dtProcedimentos, dtValores;

function mudarAba(nomeAba) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById('aba-' + nomeAba).classList.add('active');
    document.getElementById('btn-' + nomeAba).classList.add('active');
    
    if(nomeAba === 'procedimentos' && dtProcedimentos) dtProcedimentos.columns.adjust();
    if(nomeAba === 'valores' && dtValores) dtValores.columns.adjust();
}

async function carregarDados() {
    const competencia = document.getElementById('filtroCompetencia').value;
    const loaderText = document.getElementById('loading-text');
    const loader = document.getElementById('loader');
    
    loader.style.display = 'flex';
    loaderText.innerText = "Iniciando conexão com Supabase...";
    document.getElementById('aba-procedimentos').style.opacity = '0';
    document.getElementById('aba-valores').style.opacity = '0';
    
    if(dtProcedimentos) { dtProcedimentos.destroy(); $('#tabelaProcedimentos tbody').empty(); }
    if(dtValores) { dtValores.destroy(); $('#tabelaValores tbody').empty(); }

    try {
        loaderText.innerText = "Baixando Procedimentos (1/2)... Isso pode levar uns segundos.";
        const resProc = await client
            .from('simuladas_procedimentos')
            .select('*')
            // Se as colunas mudarem, altere ou comente a linha abaixo
            //.eq('competencia_arquivo', competencia)
            .order('id', { ascending: true });

        if (resProc.error) throw new Error("Erro nos Procedimentos: " + resProc.error.message);

        loaderText.innerText = "Baixando Valores Financeiros (2/2)...";
        const resVal = await client
            .from('simuladas_valores')
            .select('*')
            //.eq('competencia_arquivo', competencia)
            .order('id', { ascending: true });

        if (resVal.error) throw new Error("Erro nos Valores: " + resVal.error.message);

        loaderText.innerText = "Processando e desenhando as tabelas...";

        dtProcedimentos = $('#tabelaProcedimentos').DataTable({
            data: resProc.data,
            deferRender: true,
            pageLength: 25,
            language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json", lengthMenu: "Mostrar _MENU_" },
            dom: 'Bfrtip',
            buttons: [
                { extend: 'excelHtml5', text: '<i class="fas fa-file-excel"></i> Baixar Excel', title: 'Relatorio_Procedimentos' },
                { extend: 'csvHtml5', text: '<i class="fas fa-file-csv"></i> Baixar CSV', fieldSeparator: ';', title: 'Relatorio_Procedimentos' },
                { extend: 'print', text: '<i class="fas fa-print"></i> Imprimir' }
            ],
            columns: [
                { data: 'pagina', className: 'text-blue-600 font-bold text-center' },
                { data: 'aih', className: 'font-mono text-gray-700 font-bold' },
                { data: 'paciente', className: 'uppercase font-bold' },
                { data: 'linha', className: 'text-center text-gray-500' },
                { data: 'codigo', className: 'font-mono font-bold text-blue-800' },
                { data: 'qtde', className: 'text-center font-bold text-blue-700' },
                { data: 'cmpt', className: 'text-gray-500 text-center' },
                { data: 'documento_cnes', className: 'text-gray-500 font-mono text-center' },
                { data: 'descricao', className: 'uppercase' }
            ]
        });

        dtValores = $('#tabelaValores').DataTable({
            data: resVal.data,
            deferRender: true,
            pageLength: 25,
            language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json", lengthMenu: "Mostrar _MENU_" },
            dom: 'Bfrtip',
            buttons: [
                { extend: 'excelHtml5', text: '<i class="fas fa-file-excel"></i> Baixar Excel', title: 'Relatorio_Financeiro' },
                { extend: 'csvHtml5', text: '<i class="fas fa-file-csv"></i> Baixar CSV', fieldSeparator: ';', title: 'Relatorio_Financeiro' },
                { extend: 'print', text: '<i class="fas fa-print"></i> Imprimir' }
            ],
            columns: [
                { data: 'pagina', className: 'text-blue-600 font-bold text-center' },
                { data: 'aih', className: 'font-mono text-gray-700 font-bold' },
                { data: 'paciente', className: 'uppercase font-bold' },
                { data: 'grupo', className: 'uppercase font-semibold' },
                { data: 'valor', className: 'text-right font-mono font-bold text-blue-900' }
            ],
            createdRow: function(row, data, dataIndex) {
                if (data.grupo && data.grupo.toUpperCase().includes('TOTAL GERAL')) {
                    $(row).addClass('bg-green-100 font-black text-green-800 border-t-2 border-green-300');
                }
            }
        });

        loader.style.display = 'none';
        document.getElementById('aba-procedimentos').style.opacity = '1';
        document.getElementById('aba-valores').style.opacity = '1';

    } catch(e) {
        console.error(e);
        loader.innerHTML = `<span class="text-red-500 font-bold text-center"><i class="fas fa-exclamation-triangle text-3xl mb-2"></i><br>Erro Crítico: ${e.message}</span>`;
    }
}

document.addEventListener('DOMContentLoaded', carregarDados);
document.getElementById('filtroCompetencia').addEventListener('change', carregarDados);
</script>
</body>
</html>
