<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Auditoria - Simuladas</title>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background: #f8fafc; font-family: 'Inter', sans-serif; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: white; padding: 20px 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .dt-button { background: #10b981 !important; color: white !important; border: none !important; border-radius: 6px !important; padding: 8px 16px !important; font-weight: bold !important; font-size: 0.8rem !important; margin-right: 8px !important; }
        .dt-button.buttons-print { background: #475569 !important; }
        .dt-button.buttons-excel { background: #0284c7 !important; }
        table.dataTable thead th { background-color: #1e293b !important; color: white !important; font-size: 0.8rem; text-transform: uppercase; }
        table.dataTable tbody td { font-size: 0.8rem; color: #334155; vertical-align: middle; }
        .loading { display: flex; justify-content: center; align-items: center; height: 200px; font-size: 1.5rem; color: #64748b; font-weight: bold; }
    </style>
</head>
<body>

    <div class='header-bg'>
        <div class='max-w-7xl mx-auto flex justify-between items-center'>
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-chart-line text-4xl"></i>
                <div>
                    <h1 class='text-3xl font-bold'>Painel de Auditoria - Simuladas</h1>
                    <p class='text-blue-200'>Visão Analítica de Procedimentos Faturados</p>
                </div>
            </div>
            <div>
                <select id="filtroCompetencia" class="bg-white/20 text-white border border-white/30 rounded px-4 py-2 outline-none font-bold cursor-pointer">
                    <option value="02/2026" class="text-black">Competência: 02/2026</option>
                    </select>
                <a href="index.html" class="ml-4 bg-white/10 hover:bg-white/20 px-4 py-2 rounded text-white font-bold transition"><i class="fas fa-arrow-left"></i> Voltar</a>
            </div>
        </div>
    </div>

    <div class="max-w-[95%] mx-auto bg-white p-6 rounded-xl shadow-md border border-gray-200">
        <div id="loader" class="loading"><i class="fas fa-spinner fa-spin mr-3"></i> A carregar milhares de registros do banco de dados...</div>
        
        <table id="tabelaProcedimentos" class="display w-full" style="display:none;">
            <thead>
                <tr>
                    <th>AIH</th>
                    <th>Paciente</th>
                    <th>Pág</th>
                    <th>Lnh</th>
                    <th>Código</th>
                    <th>Qtd</th>
                    <th>Cmpt</th>
                    <th>Doc/CNES</th>
                    <th>Descrição do Procedimento</th>
                </tr>
            </thead>
            <tbody id="tabelaBody">
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = "https://voweywtzoldwfhgkniup.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvd2V5d3R6b2xkd2ZoZ2tuaXVwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2ODEwMTU5NSwiZXhwIjoyMDgzNjc3NTk1fQ.deftZEa4j3SFFsNNjVhU4cE67CGi1rVQSBAltz-AmPk";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dataTable;

        async function carregarDados() {
            const competencia = document.getElementById('filtroCompetencia').value;
            
            document.getElementById('loader').style.display = 'flex';
            if(dataTable) {
                dataTable.destroy();
                document.getElementById('tabelaProcedimentos').style.display = 'none';
            }

            // Busca os dados do Supabase
            const { data, error } = await supabase
                .from('simuladas_procedimentos')
                .select('*')
                .eq('competencia_arquivo', competencia)
                .order('pagina', { ascending: true })
                .order('linha', { ascending: true });

            if (error) {
                alert('Erro ao carregar dados: ' + error.message);
                return;
            }

            const tbody = document.getElementById('tabelaBody');
            tbody.innerHTML = '';

            data.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td class="font-bold text-blue-700">${row.aih}</td>
                        <td class="uppercase font-medium text-gray-800">${row.paciente}</td>
                        <td class="text-center text-gray-500">${row.pagina}</td>
                        <td class="text-center">${row.linha}</td>
                        <td class="font-mono text-gray-600">${row.codigo}</td>
                        <td class="text-center font-bold">${row.qtde}</td>
                        <td>${row.cmpt}</td>
                        <td class="text-xs text-gray-400">${row.documento_cnes}</td>
                        <td class="uppercase">${row.descricao}</td>
                    </tr>
                `;
            });

            document.getElementById('loader').style.display = 'none';
            document.getElementById('tabelaProcedimentos').style.display = 'table';

            // Inicializa a tabela com os Botões Mágicos
            dataTable = $('#tabelaProcedimentos').DataTable({
                language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json" },
                dom: 'Bfrtip',
                pageLength: 25,
                buttons: [
                    { extend: 'excelHtml5', text: '<i class="fas fa-file-excel"></i> Exportar Excel', title: 'Relatorio_Procedimentos_Simuladas' },
                    { extend: 'csvHtml5', text: '<i class="fas fa-file-csv"></i> Baixar CSV', fieldSeparator: ';', title: 'Relatorio_Procedimentos_Simuladas' },
                    { extend: 'print', text: '<i class="fas fa-print"></i> Imprimir Relatório', title: 'Auditoria de Procedimentos - ' + competencia }
                ]
            });
        }

        // Carrega ao iniciar e ao mudar o filtro
        document.addEventListener('DOMContentLoaded', carregarDados);
        document.getElementById('filtroCompetencia').addEventListener('change', carregarDados);

    </script>
</body>
</html>
