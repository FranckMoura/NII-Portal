<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Série Histórica Faturamento - NII</title>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="dados_financeiros.js"></script>

    <style>
        body { font-family: 'Roboto', sans-serif; background: #f3f4f6; color: #1e293b; margin: 0; min-height: 100vh; padding-bottom: 40px; }
        
        .header-bg { background: linear-gradient(135deg, #000428 0%, #004e92 100%) !important; color: white !important; padding: 20px 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .container { max-width: 1400px; margin: -20px auto 0; padding: 0 20px; position: relative; z-index: 10; }
        
        /* BOTÃO VOLTAR E LOGO */
        .header-mini-logo { height: 45px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); transition: transform 0.3s; }
        .btn-back { background: rgba(255,255,255,0.2); color: white; padding: 8px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.2s; border: 1px solid rgba(255,255,255,0.3); display: inline-flex; align-items: center; gap: 8px; }
        .btn-back:hover { background: rgba(255,255,255,0.3); }

        /* BARRA DE FILTROS POWER BI STYLE */
        .filter-panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-label { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-select { background: #f8fafc; border: 1px solid #cbd5e1; color: #1e293b; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; outline: none; width: 100%; transition: border-color 0.2s; height: 40px;}
        .filter-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        
        /* SELECT DESTACADO (MODO DE VISÃO) */
        .select-modo { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; font-weight: 800; cursor: pointer; }
        .select-modo:hover { background: #bae6fd; }

        .btn-action { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; transition: 0.2s; cursor: pointer; border: none; height: 40px; }
        .btn-clear { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .btn-clear:hover { background: #e2e8f0; color: #1e293b; }
        .btn-print { background: #10b981; color: white; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); }
        .btn-print:hover { background: #059669; transform: translateY(-1px); box-shadow: 0 6px 8px rgba(16, 185, 129, 0.3); }

        /* Select2 Ajustes */
        .select2-container--default .select2-selection--multiple { background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; min-height: 40px; padding: 2px 4px; }
        .select2-container--default.select2-container--focus .select2-selection--multiple { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .select2-container--default .select2-selection--multiple .select2-selection__choice { background-color: #e0f2fe; border: 1px solid #bae6fd; color: #0369a1; border-radius: 4px; font-size: 0.75rem; font-weight: 700; margin-top: 6px; }
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove { color: #0369a1; margin-right: 5px; border-right: 1px solid #bae6fd; padding-right: 5px;}
        .select2-container--default .select2-selection--multiple .select2-selection__choice__remove:hover { background: transparent; color: #e11d48; }

        /* KPI / CARDS */
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .meta-card { background: white; padding: 20px 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: relative; overflow: hidden; transition: transform 0.2s; border: 1px solid #e2e8f0; text-align: center; }
        .meta-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .meta-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
        .border-blue::before { background: #1e40af; } 
        .border-green::before { background: #10b981; } 
        .border-purple::before { background: #6d28d9; } 
        .border-yellow::before { background: #b45309; }
        .meta-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 6px; }
        .meta-value { font-size: 1.8rem; font-weight: 900; color: #0f172a; line-height: 1.2; margin-bottom: 5px; }
        .meta-sub { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }

        /* GRÁFICOS E TABELA */
        .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px; }
        .chart-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .chart-box h4 { margin: 0 0 20px 0; font-size: 1.05rem; color: #0f172a; font-weight: 800; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px; }

        table.dataTable { width: 100% !important; border-collapse: collapse !important; }
        table.dataTable thead th { background-color: #f8fafc !important; color: #334155 !important; font-weight: 800 !important; text-transform: uppercase; padding: 12px 10px !important; font-size: 0.75rem; border-bottom: 2px solid #cbd5e1 !important; text-align: left; }
        table.dataTable tbody td { padding: 10px 10px !important; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.85rem; vertical-align: middle; }
        .valor-formatado { font-weight: bold; color: #004e92; }
        .badge-grupo { background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }

        /* IMPRESSÃO PERFEITA PARA PDF */
        @media print {
            @page { margin: 10mm; size: A4 landscape; }
            body { background: white !important; font-size: 10pt; }
            .header-bg { background: white !important; color: black !important; padding: 0; box-shadow: none; border-bottom: 2px solid #000; margin-bottom: 10px; }
            .header-bg h1 { color: black !important; }
            .header-bg p { color: #333 !important; }
            .filter-panel, .dataTables_filter, .dataTables_length, .dataTables_paginate, .dt-buttons, .btn-back { display: none !important; }
            .container { margin-top: 10px; padding: 0; box-shadow: none; }
            .kpi-row { display: flex !important; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
            .meta-card { border: 1px solid #ccc !important; box-shadow: none !important; padding: 10px !important; flex: 1; }
            .charts-row { display: flex !important; gap: 15px; height: 250px; margin-bottom: 20px; page-break-inside: avoid; }
            canvas { max-height: 220px !important; }
            .chart-box { border: 1px solid #ccc !important; padding: 10px !important; box-shadow: none !important; }
            table.dataTable thead th { border-bottom: 1px solid #000 !important; color: #000 !important; }
            table.dataTable tbody td { border-bottom: 1px solid #ccc !important; color: #000 !important; }
        }
    </style>
</head>
<body>

    <div class='header-bg pb-12'>
        <div class='max-w-7xl mx-auto flex justify-between items-center'>
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-chart-line text-3xl text-white"></i>
                <div>
                    <h1 class='text-2xl font-bold text-white'>Painel Executivo de Faturamento SUS</h1>
                    <p class='text-blue-200 text-sm'>Análise de Série Histórica - Hospital Beneficente Santa Helena</p>
                </div>
            </div>
            
            <div class="flex items-center gap-5">
                <img src="../logo.png" alt="Logo HSH" class="header-mini-logo" onerror="this.src='https://voweywtzoldwfhgkniup.supabase.co/storage/v1/object/public/arquivos-faturamento/logo.png'">
                <a href="modulo_operacional.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar</a>
            </div>
        </div>
    </div>

    <div class="container">
        
        <div class="filter-panel no-print">
            
            <div class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end mb-4 border-b border-slate-100 pb-4">
                <div class="filter-group md:col-span-2">
                    <label class="filter-label"><i class="fas fa-eye text-blue-500"></i> Informação dos Gráficos e Tabelas</label>
                    <select id="filtroModoVisao" class="filter-select select-modo" onchange="aplicarFiltros()">
                        <option value="FINANCEIRO">📊 Visão Financeira (Valor Aprovado em R$)</option>
                        <option value="FISICO">👥 Visão Físico/Quantitativa (Volume Produzido)</option>
                    </select>
                </div>
                <div class="filter-group md:col-span-4 flex justify-end gap-2">
                    <button class="btn-action btn-clear" onclick="limparFiltros()"><i class="fas fa-eraser"></i> Limpar Filtros</button>
                    <button class="btn-action btn-print" onclick="window.print()"><i class="fas fa-file-pdf"></i> Imprimir / Salvar PDF</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div class="filter-group">
                    <label class="filter-label">Ano</label>
                    <select id="filtroAno" class="filter-select" onchange="aplicarFiltros()"><option value="TODOS">Todos</option></select>
                </div>
                
                <div class="filter-group">
                    <label class="filter-label">Mês</label>
                    <select id="filtroMes" class="filter-select" onchange="aplicarFiltros()">
                        <option value="TODOS">Todos</option>
                        <option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option>
                        <option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option>
                        <option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option>
                        <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Origem</label>
                    <select id="filtroOrigem" class="filter-select" onchange="aplicarFiltros()"><option value="TODOS">Todas</option></select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Grupo SUS (SIGTAP)</label>
                    <select id="filtroGrupo" class="filter-select" onchange="aplicarFiltros()"><option value="TODOS">Todos os Grupos</option></select>
                </div>
            </div>
            
            <div class="mt-4 filter-group">
                <label class="filter-label"><i class="fas fa-search text-slate-400"></i> Agrupar Procedimentos Específicos (Múltipla Escolha)</label>
                <select id="filtroProcedimento" class="filter-select" multiple="multiple"></select>
            </div>
        </div>

        <div class="kpi-row">
            <div class="meta-card border-blue">
                <div class="meta-title" id="tituloCard1">Faturamento Aprovado <i class="fas fa-coins text-blue-400"></i></div>
                <div class="meta-value" id="kpiTotal">R$ 0,00</div>
            </div>
            
            <div class="meta-card border-green">
                <div class="meta-title" id="tituloCard2">Volume Produzido <i class="fas fa-procedures text-green-400"></i></div>
                <div class="meta-value" id="kpiQtd" style="color:#10b981;">0</div>
            </div>
            
            <div class="meta-card border-purple">
                <div class="meta-title" id="tituloCard3">Ticket Médio (SUS) <i class="fas fa-receipt text-purple-400"></i></div>
                <div class="meta-value" id="kpiTicket" style="color:#6d28d9;">R$ 0,00</div>
            </div>
            
            <div class="meta-card border-yellow">
                <div class="meta-title" id="labelTopProc">Maior Faturamento <i class="fas fa-star text-yellow-400"></i></div>
                <div class="meta-value" id="kpiTopProc" style="font-size: 1rem; padding-top:10px; color:#b45309; word-wrap: break-word; white-space: normal; line-height: 1.3;">-</div>
            </div>
        </div>

        <div class="charts-row">
            <div class="chart-box">
                <h4 id="tituloChartEvolucao"><i class="fas fa-chart-bar text-blue-600 mr-2"></i> Evolução no Período</h4>
                <div style="height:250px;"><canvas id="chartEvolucao"></canvas></div>
            </div>
            <div class="chart-box">
                <h4 id="tituloChartOrigem"><i class="fas fa-chart-bar text-orange-500 mr-2"></i> Origem de Produção</h4>
                <div style="height:250px;"><canvas id="chartOrigem"></canvas></div>
            </div>
        </div>

        <div class="chart-box" style="padding-top:10px;">
            <h4 style="color:#0f172a;"><i class="fas fa-list-ul text-blue-600 mr-2"></i> Detalhamento Analítico Completo (SIGTAP)</h4>
            <table id="tabelaFinanceira" class="display compact hover" style="width:100%"></table>
        </div>
    </div>

    <script>
        let chartEvolucao = null;
        let chartOrigem = null;
        let dataTableInstance = null;

        function formatCurrency(val) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0); }
        function formatNumber(val) { return new Intl.NumberFormat('pt-BR').format(val || 0); }

        $(document).ready(function() {
            if (typeof DADOS_FINANCEIROS === 'undefined') {
                alert("Erro: Arquivo 'dados_financeiros.js' não encontrado. Rode o script Python primeiro!");
                return;
            }
            inicializarDropdowns();
            aplicarFiltros();
            
            $('#filtroProcedimento').on('change', function() { aplicarFiltros(); });
        });

        function inicializarDropdowns() {
            let anos = new Set(); let origens = new Set(); let grupos = new Set(); let procs = new Set();

            DADOS_FINANCEIROS.forEach(d => {
                if(d.Ano) anos.add(d.Ano);
                if(d.Origem) origens.add(d.Origem);
                if(d.Grupo_SUS) grupos.add(d.Grupo_SUS);
                if(d.Procedimento_Completo) procs.add(d.Procedimento_Completo);
            });

            let selAno = document.getElementById('filtroAno');
            [...anos].sort().reverse().forEach(a => selAno.add(new Option(a, a)));
            if(anos.size > 0) selAno.value = [...anos].sort().reverse()[0];

            let selOrigem = document.getElementById('filtroOrigem');
            [...origens].sort().forEach(o => selOrigem.add(new Option(o, o)));

            let selGrupo = document.getElementById('filtroGrupo');
            [...grupos].sort().forEach(g => selGrupo.add(new Option(g, g)));

            let selProc = document.getElementById('filtroProcedimento');
            [...procs].sort().forEach(p => selProc.add(new Option(p, p)));

            $('#filtroProcedimento').select2({
                placeholder: "Clique aqui para pesquisar procedimentos (Ex: parto, cesariana...)",
                allowClear: true,
                language: { noResults: function() { return "Nenhum procedimento encontrado"; } }
            });
        }

        function limparFiltros() {
            document.getElementById('filtroMes').value = 'TODOS';
            document.getElementById('filtroOrigem').value = 'TODOS';
            document.getElementById('filtroGrupo').value = 'TODOS';
            $('#filtroProcedimento').val(null).trigger('change.select2'); 
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const fAno = $('#filtroAno').val();
            const fMes = $('#filtroMes').val();
            const fOrig = $('#filtroOrigem').val();
            const fGrp = $('#filtroGrupo').val();
            const fProcArray = $('#filtroProcedimento').val() || []; 
            
            let dadosFiltrados = DADOS_FINANCEIROS.filter(d => {
                let matchAno = (fAno === 'TODOS' || d.Ano == fAno);
                let matchMes = (fMes === 'TODOS' || d.Mes == fMes);
                let matchOrig = (fOrig === 'TODOS' || d.Origem == fOrig);
                let matchGrp = (fGrp === 'TODOS' || d.Grupo_SUS == fGrp);
                let matchProc = (fProcArray.length === 0 || fProcArray.includes(d.Procedimento_Completo));

                return matchAno && matchMes && matchOrig && matchGrp && matchProc;
            });

            atualizarDashboard(dadosFiltrados);
        }

        function atualizarDashboard(dados) {
            const modoVisao = $('#filtroModoVisao').val(); // 'FINANCEIRO' ou 'FISICO'

            let totalValor = 0; let totalQtd = 0;
            let mapEvolucao = {}; let mapOrigem = {}; let mapProcedimentos = {};

            dados.forEach(d => {
                totalValor += d['Valor Aprovado'];
                totalQtd += d['Quantidade'];

                let valorParaGrafico = modoVisao === 'FINANCEIRO' ? d['Valor Aprovado'] : d['Quantidade'];

                let chaveTempo = `${d.Ano}-${d.Mes}`; 
                mapEvolucao[chaveTempo] = (mapEvolucao[chaveTempo] || 0) + valorParaGrafico;
                
                let origem = d.Origem || 'Outros';
                mapOrigem[origem] = (mapOrigem[origem] || 0) + valorParaGrafico;

                let proc = d.Procedimento_Completo;
                if (!mapProcedimentos[proc]) {
                    mapProcedimentos[proc] = { grp: d.Grupo_SUS, orig: origem, qtd: 0, valor: 0 };
                }
                mapProcedimentos[proc].qtd += d['Quantidade'];
                mapProcedimentos[proc].valor += d['Valor Aprovado'];
            });

            // Lógica de Mutação dos Painéis Superiores baseada no Switch
            if(modoVisao === 'FINANCEIRO') {
                $('#tituloCard1').html('Faturamento Aprovado <i class="fas fa-coins text-blue-400"></i>');
                $('#kpiTotal').text(formatCurrency(totalValor));

                $('#tituloCard2').html('Volume Produzido <i class="fas fa-procedures text-green-400"></i>');
                $('#kpiQtd').text(formatNumber(totalQtd));

                $('#tituloCard3').html('Ticket Médio (SUS) <i class="fas fa-receipt text-purple-400"></i>');
                $('#kpiTicket').text(formatCurrency(totalValor / (totalQtd || 1)));

                $('#labelTopProc').html('Maior Faturamento (R$) <i class="fas fa-star text-yellow-400"></i>');
                $('#tituloChartEvolucao').html('<i class="fas fa-chart-bar text-blue-600 mr-2"></i> Evolução Financeira (R$)');
                $('#tituloChartOrigem').html('<i class="fas fa-chart-bar text-orange-500 mr-2"></i> Dinheiro por Origem');
            } else {
                $('#tituloCard1').html('Volume Físico Total <i class="fas fa-hashtag text-blue-400"></i>');
                $('#kpiTotal').text(formatNumber(totalQtd));

                $('#tituloCard2').html('Faturamento Ref. <i class="fas fa-coins text-green-400"></i>');
                $('#kpiQtd').text(formatCurrency(totalValor)); // Mostra o valor como referência secundária

                let qtdProcsUnicos = Object.keys(mapProcedimentos).length;
                $('#tituloCard3').html('Tipos de Procedimentos <i class="fas fa-list text-purple-400"></i>');
                $('#kpiTicket').text(qtdProcsUnicos); // Mostra quantos procedimentos distintos compõem o filtro

                $('#labelTopProc').html('Maior Produção (Qtd) <i class="fas fa-users text-yellow-400"></i>');
                $('#tituloChartEvolucao').html('<i class="fas fa-chart-bar text-green-600 mr-2"></i> Evolução Quantitativa (Qtd)');
                $('#tituloChartOrigem').html('<i class="fas fa-chart-bar text-emerald-500 mr-2"></i> Volume por Origem');
            }

            let topProc = "-"; let maxMetrica = -1; let arrayTabela = [];
            
            for (const [proc, stats] of Object.entries(mapProcedimentos)) {
                let metricaDeCorte = modoVisao === 'FINANCEIRO' ? stats.valor : stats.qtd;
                if (metricaDeCorte > maxMetrica) { 
                    maxMetrica = metricaDeCorte; 
                    topProc = proc; 
                }
                arrayTabela.push({ proc: proc, grp: stats.grp, orig: stats.orig, qtd: stats.qtd, ticket: stats.qtd > 0 ? (stats.valor / stats.qtd) : 0, valor: stats.valor });
            }
            
            let nomeLimpo = topProc.split(' - ').slice(1).join(' - ') || topProc;
            $('#kpiTopProc').html(nomeLimpo.length > 50 ? nomeLimpo.substring(0, 50) + '...' : nomeLimpo);

            renderizarGraficos(mapEvolucao, mapOrigem, modoVisao);
            renderizarTabela(arrayTabela, modoVisao);
        }

        function renderizarGraficos(mapEvolucao, mapOrigem, modoVisao) {
            let keysOrdenadas = Object.keys(mapEvolucao).sort();
            let labelsLinha = keysOrdenadas.map(k => k.split('-').reverse().join('/'));
            let valoresLinha = keysOrdenadas.map(k => mapEvolucao[k]);

            let tooltipCallback = function(c) { return modoVisao === 'FINANCEIRO' ? formatCurrency(c.raw) : formatNumber(c.raw) + ' realizados'; };

            // 1. Gráfico de Evolução (Tornado em Barras Verticais)
            const ctx1 = document.getElementById('chartEvolucao').getContext('2d');
            if(chartEvolucao) chartEvolucao.destroy();
            let corBarraEvolucao = modoVisao === 'FINANCEIRO' ? '#004e92' : '#10b981';

            chartEvolucao = new Chart(ctx1, {
                type: 'bar',
                data: { labels: labelsLinha, datasets: [{ data: valoresLinha, backgroundColor: corBarraEvolucao, borderRadius: 4 }] },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: tooltipCallback } } }, scales: { y: { beginAtZero: true, ticks: { callback: function(v){ return modoVisao === 'FINANCEIRO' ? formatCurrency(v) : formatNumber(v); } } }, x: { grid: { display: false } } } }
            });

            // 2. Gráfico de Origem (Tornado em Barras Horizontais)
            const ctx2 = document.getElementById('chartOrigem').getContext('2d');
            if(chartOrigem) chartOrigem.destroy();
            let coresOrigem = modoVisao === 'FINANCEIRO' ? ['#0284c7', '#f59e0b'] : ['#059669', '#d97706'];

            chartOrigem = new Chart(ctx2, {
                type: 'bar',
                data: { labels: Object.keys(mapOrigem), datasets: [{ data: Object.values(mapOrigem), backgroundColor: coresOrigem, borderRadius: 4 }] },
                options: { 
                    indexAxis: 'y', // Faz as barras deitarem (ótimo para comparar Internacional vs Ambulatório)
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: tooltipCallback } } },
                    scales: { x: { beginAtZero: true, ticks: { callback: function(v){ return modoVisao === 'FINANCEIRO' ? formatCurrency(v) : formatNumber(v); } } }, y: { grid: { display: false } } }
                }
            });
        }

        function renderizarTabela(dados, modoVisao) {
            if ($.fn.DataTable.isDataTable('#tabelaFinanceira')) $('#tabelaFinanceira').DataTable().destroy();
            $('#tabelaFinanceira').empty(); // Limpa colunas antigas da memória

            // Constrói as colunas dinamicamente baseado na visão
            let colunas = [
                { title: "Procedimento", data: 'proc', render: d => `<b style="color:#1e293b; font-size: 0.8rem;">${d}</b>` },
                { title: "Grupo SUS", data: 'grp', render: d => `<span class="badge-grupo">${d.split(' - ')[1] || d}</span>` },
                { title: "Origem", data: 'orig' },
                { title: "Qtd. Realizada", data: 'qtd', render: $.fn.dataTable.render.number('.', ',', 0, ''), className: 'dt-body-center font-bold text-lg text-emerald-600' }
            ];

            // Se for financeiro, injeta as colunas de Dinheiro na tabela
            if(modoVisao === 'FINANCEIRO') {
                colunas.push({ title: "Ticket (R$)", data: 'ticket', render: d => formatCurrency(d), className: 'dt-body-right' });
                colunas.push({ title: "Total Aprovado (R$)", data: 'valor', render: d => `<span class="valor-formatado">${formatCurrency(d)}</span>`, className: 'dt-body-right text-lg' });
            }

            // Define por qual coluna ordenar (Se Físico = Coluna Qtd. Se Financeiro = Coluna Valor)
            let ordemColuna = modoVisao === 'FINANCEIRO' ? 5 : 3;

            dataTableInstance = $('#tabelaFinanceira').DataTable({
                data: dados,
                dom: 'Brtip',
                pageLength: 10,
                order: [[ordemColuna, 'desc']], 
                language: { url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json" },
                buttons: [ { extend: 'excelHtml5', className: 'dt-button', text: '<i class="fas fa-file-excel text-green-600"></i> Exportar para Excel' } ],
                columns: colunas
            });
        }
    </script>
</body>
</html>
