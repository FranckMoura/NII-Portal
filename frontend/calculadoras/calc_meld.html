<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escore MELD - Portal NII</title>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --color-primary: #38bdf8;
            --color-success: #34d399;
            --color-warning: #fbbf24;
            --color-danger:  #f87171;
            --color-purple:  #c084fc;
        }
        
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .calc-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 600px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .input-form { width: 100%; padding: 12px; border-radius: 8px; font-size: 0.9rem; background: var(--bg-body); border: 1px solid var(--border-color); color: var(--text-main); outline: none; margin-top: 6px; transition: 0.2s; }
        .input-form:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .btn-submit { width: 100%; background: var(--color-primary); color: white; font-weight: 700; padding: 12px; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; margin-top: 15px; box-shadow: 0 4px 6px -1px rgba(56, 189, 248, 0.3); }
        .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="calc-container">
        <h2 class="font-bold text-xl mb-6 border-b border-slate-700 pb-3 flex items-center gap-2">
            <i class="fas fa-calculator text-amber-400"></i> Escore MELD (Mortalidade de Fila)
        </h2>
        
        <div class="space-y-4">
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Creatinina Sérica (mg/dL)</label>
                <input type="number" id="meldCreatinina" class="input-form" value="1.0" min="0.1" step="0.01" placeholder="Ex: 1.2">
            </div>

            <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Bilirrubina Total (mg/dL)</label>
                <input type="number" id="meldBilirrubina" class="input-form" value="1.0" min="0.1" step="0.01" placeholder="Ex: 2.1">
            </div>

            <div>
                <label class="text-xs font-bold text-gray-400 uppercase">INR (Tempo de Protrombina)</label>
                <input type="number" id="meldINR" class="input-form" value="1.0" min="0.5" step="0.01" placeholder="Ex: 1.1">
            </div>

            <div class="bg-black/15 p-3.5 border border-slate-700/60 rounded-lg flex items-center gap-3">
                <input type="checkbox" id="meldDialise" class="w-4 h-4 text-amber-500 accent-amber-500 cursor-pointer">
                <label for="meldDialise" class="text-xs font-semibold text-gray-300 cursor-pointer select-none">
                    Realizou diálise (pelo menos 2x) nos últimos 7 dias?
                </label>
            </div>
        </div>

        <button onclick="calcularMELD()" class="btn-submit bg-amber-500 hover:bg-amber-600 shadow-amber-500/30">Calcular Score MELD</button>
        
        <div id="calcResult" class="mt-6 font-bold text-xl py-4 px-5 bg-black/20 rounded hidden border border-gray-600/30"></div>
        
        <div class="mt-8 text-center text-xs font-semibold text-slate-500 border-t border-slate-700/50 pt-4">
            Desenvolvido por Franck Moura
        </div>
    </div>

    <script>
        function calcularMELD() {
            let cre = parseFloat($('#meldCreatinina').val());
            let bil = parseFloat($('#meldBilirrubina').val());
            let inr = parseFloat($('#meldINR').val());
            let dialise = $('#meldDialise').is(':checked');

            if (isNaN(cre) || isNaN(bil) || isNaN(inr)) {
                alert("Por favor, preencha todos os campos com valores numéricos válidos.");
                return;
            }

            // Regras Oficiais de Corte UNOS/MELD:
            // 1. Se o paciente fez diálise na última semana, o valor da Creatinina é travado em 4.0 mg/dL automaticamente
            if (dialise || cre > 4.0) {
                cre = 4.0;
            }

            // 2. Qualquer valor menor que 1.0 é arredondado para 1.0 para evitar logs negativos na fórmula
            if (cre < 1.0) cre = 1.0;
            if (bil < 1.0) bil = 1.0;
            if (inr < 1.0) inr = 1.0;

            // Fórmula padrão UNOS MELD:
            // MELD = 3.78 * ln(Bilirrubina) + 11.2 * ln(INR) + 9.57 * ln(Creatinina) + 6.43
            let escoreMeld = (3.78 * Math.log(bil)) + (11.2 * Math.log(inr)) + (9.57 * Math.log(cre)) + 6.43;
            
            // Arredondamento oficial para número inteiro
            let resultadoFinal = Math.round(escoreMeld);

            // Análise de mortalidade estimada em 3 meses (Critério de Fila de Transplante)
            let riscoMortalidade = ""; let cor = "";
            if (resultadoFinal >= 40) { riscoMortalidade = "71.3% de risco de mortalidade"; cor = "text-red-400"; }
            else if (resultadoFinal >= 30 && resultadoFinal <= 39) { riscoMortalidade = "52.6% de risco de mortalidade"; cor = "text-red-400"; }
            else if (resultadoFinal >= 20 && resultadoFinal <= 29) { riscoMortalidade = "19.6% de risco de mortalidade"; cor = "text-yellow-400"; }
            else if (resultadoFinal >= 10 && resultadoFinal <= 19) { riscoMortalidade = "6.0% de risco de mortalidade"; cor = "text-green-400"; }
            else { riscoMortalidade = "1.9% de risco de mortalidade"; cor = "text-green-400"; }

            $('#calcResult').html(`
                <div class="flex justify-between items-center border-b border-gray-600/50 pb-3 mb-3">
                    <span class="text-gray-400 text-sm">Resultado Escore MELD:</span>
                    <span class="${cor} text-3xl font-black">${resultadoFinal}</span>
                </div>
                <div class="text-xs font-normal text-gray-400 leading-relaxed">
                    <span class="text-gray-500 font-bold uppercase text-[0.65rem] block mb-1">Mortalidade Estimada em 3 Meses:</span>
                    <p class="text-gray-200 font-semibold text-sm">${riscoMortalidade}</p>
                </div>
            `).removeClass('hidden');
        }
    </script>
</body>
</html>
