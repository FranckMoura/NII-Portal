<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reposição de Sódio - Portal NII</title>
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --color-primary: #38bdf8;
            --color-success: #34d399;
            --color-warning: #fbbf24;
            --color-danger:  #f87171;
            --color-purple:  #c084fc;
        }
        
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .calc-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 650px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .input-form { width: 100%; padding: 12px; border-radius: 8px; font-size: 0.9rem; background: var(--bg-body); border: 1px solid var(--border-color); color: var(--text-main); outline: none; margin-top: 6px; transition: 0.2s; }
        .input-form:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .btn-submit { width: 100%; background: var(--color-primary); color: white; font-weight: 700; padding: 12px; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; margin-top: 15px; box-shadow: 0 4px 6px -1px rgba(56, 189, 248, 0.3); }
        .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="calc-container">
        <h2 class="font-bold text-xl mb-6 border-b border-slate-700 pb-3 flex items-center gap-2">
            <i class="fas fa-flask text-sky-400"></i> Reposição de Sódio (Adrogué-Madias)
        </h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Sexo</label>
                <select id="sSexo" class="input-form">
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                </select>
            </div>
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Idade (anos)</label>
                <input type="number" id="sIdade" class="input-form" placeholder="Ex: 60" min="1">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Peso (kg)</label>
                <input type="number" id="sPeso" class="input-form" placeholder="Ex: 70" min="1" step="0.1">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Sódio Atual (mEq/L)</label>
                <input type="number" id="sNaAtual" class="input-form" placeholder="Ex: 115" min="100">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Sódio Alvo (mEq/L)</label>
                <input type="number" id="sNaAlvo" class="input-form" placeholder="Máx +8 mEq/24h" min="100">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-400 uppercase">Solução de Infusão</label>
                <select id="sSolucao" class="input-form border-sky-500/50">
                    <option value="513">NaCl 3% (Salina Hipertônica - 513 mEq/L)</option>
                    <option value="154">NaCl 0.9% (Soro Fisiológico - 154 mEq/L)</option>
                    <option value="130">Ringer Lactato (130 mEq/L)</option>
                </select>
            </div>
        </div>

        <div class="bg-yellow-500/10 border border-yellow-500/30 p-3 rounded-lg text-xs text-yellow-500 mb-4">
            <i class="fas fa-exclamation-triangle mr-1"></i> <b>Atenção:</b> A correção de sódio não deve exceder <b>8 a 10 mEq/L em 24h</b> para evitar Mielinólise Pontina Central.
        </div>

        <button onclick="calcularSodio()" class="btn-submit bg-sky-500 hover:bg-sky-600 shadow-sky-500/30">Calcular Reposição</button>
        
        <div id="calcResult" class="mt-6 hidden"></div>
        
        <div class="mt-8 text-center text-xs font-semibold text-slate-500 border-t border-slate-700/50 pt-4">
            Fórmula de Adrogué-Madias • Desenvolvido por Franck Moura
        </div>
    </div>

    <script>
        function calcularSodio() {
            let sexo = $('#sSexo').val();
            let idade = parseInt($('#sIdade').val());
            let peso = parseFloat($('#sPeso').val());
            let naAtual = parseFloat($('#sNaAtual').val());
            let naAlvo = parseFloat($('#sNaAlvo').val());
            let naSolucao = parseFloat($('#sSolucao').val());

            if (!idade || !peso || !naAtual || !naAlvo) {
                alert("Preencha todos os campos corretamente.");
                return;
            }

            if (naAlvo <= naAtual) {
                alert("O Sódio Alvo deve ser maior que o Sódio Atual para calcular reposição.");
                return;
            }

            // Fator de Água Corporal Total (ACT)
            let fatorAct = 0.6;
            if (sexo === 'M') {
                fatorAct = (idade >= 65) ? 0.5 : 0.6;
            } else {
                fatorAct = (idade >= 65) ? 0.4 : 0.5;
            }

            let act = peso * fatorAct;
            let deficitNa = act * (naAlvo - naAtual);
            
            // Fórmula Adrogué-Madias: Variação de Na+ com 1 Litro de Solução = (Na infusão - Na atual) / (ACT + 1)
            let mudancaCom1L = (naSolucao - naAtual) / (act + 1);
            
            // Volume total em Litros necessário para atingir a meta
            let volumeRequeridoL = (naAlvo - naAtual) / mudancaCom1L;
            let volumeRequeridoML = volumeRequeridoL * 1000;

            let diferencaAlvo = naAlvo - naAtual;
            let alertaCorrecao = "";
            if (diferencaAlvo > 10) {
                alertaCorrecao = `<div class="mt-3 p-2 bg-red-500/20 border border-red-500/50 rounded text-red-400 text-xs font-bold"><i class="fas fa-times-circle mr-1"></i> PERIGO: A meta estabelecida excede a correção segura de 10 mEq/L em 24h. Risco de Mielinólise!</div>`;
            }

            $('#calcResult').html(`
                <div class="bg-black/20 p-5 rounded-lg border border-gray-600/30">
                    <h3 class="text-lg font-bold text-white border-b border-slate-700/50 pb-2 mb-3">Resultado da Infusão</h3>
                    
                    <div class="grid grid-cols-2 gap-y-3 text-sm">
                        <div class="text-gray-400">Água Corporal Total (ACT):</div>
                        <div class="text-right font-mono text-gray-200">${act.toFixed(1)} L</div>
                        
                        <div class="text-gray-400">Déficit de Sódio:</div>
                        <div class="text-right font-mono text-gray-200">${deficitNa.toFixed(1)} mEq</div>
                        
                        <div class="text-gray-400">Mudança esperada com 1L da solução:</div>
                        <div class="text-right font-mono text-gray-200">+ ${mudancaCom1L.toFixed(2)} mEq/L</div>
                        
                        <div class="text-gray-400 font-bold mt-2 pt-2 border-t border-slate-700">Volume Total a Infundir:</div>
                        <div class="text-right font-mono font-black text-sky-400 text-xl mt-2 pt-2 border-t border-slate-700">${volumeRequeridoML.toFixed(0)} mL</div>
                    </div>
                    ${alertaCorrecao}
                </div>
            `).removeClass('hidden');
        }
    </script>
</body>
</html>
