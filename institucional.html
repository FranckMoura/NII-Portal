<script>
        let dataTable;

        // Configuração das Colunas
        const CONFIG_COLUNAS = {
            'profissionais': [
                { title: "Nome", data: "profissional_nome" },
                { title: "CNS", data: "profissional_cns" },
                { title: "CBO", data: "profissional_cbo" },
                { title: "Vínculo", data: "profissional_vinculo" },
                { title: "CH Hosp", data: "carga_horaria_hospitalar_sus" }
            ],
            'leitos': [
                { title: "Especialidade", data: "LEITO" },
                { title: "Tipo", data: "TIPO DO LEITO" },
                { title: "Qtde Existente", data: "LEITOS EXISTENTES" },
                { title: "Qtde SUS", data: "LEITOS SUS" }
            ],
            'habilitacoes': [
                { title: "Habilitação", data: "MARCAÇÃO" },
                { title: "Nº Leitos", data: "MARCAÇÃO - Nº LEITOS" },
                { title: "Competência", data: "COMPETÊNCIA" }
            ],
            'servicos': [
                { title: "Serviço", data: "SERVIÇO" },
                { title: "Classificação", data: "SERVIÇO CLASSIFICAÇÃO" },
                { title: "Amb. SUS", data: "SERVIÇO - AMBULATORIAL SUS" },
                { title: "Hosp. SUS", data: "SERVIÇO - HOSPITALAR SUS" }
            ]
        };

        async function carregarTabela(tipo) {
            const nomeArquivo = `elastic_${tipo}.csv`;
            
            // Truque do Cache (Para forçar atualização)
            const url = `arquivos/${nomeArquivo}?v=${new Date().getTime()}`;
            
            document.getElementById('area-tabela').style.display = 'block';
            document.getElementById('titulo-tabela').innerText = `Carregando ${tipo}...`;

            Papa.parse(url, {
                download: true,
                header: true,
                delimiter: ",",  // <--- AQUI ESTAVA O ERRO! MUDAMOS PARA VÍRGULA
                skipEmptyLines: true,
                complete: function(results) {
                    console.log("Dados carregados:", results.data); // Para debug no console
                    
                    const colunas = CONFIG_COLUNAS[tipo] || results.meta.fields.map(c => ({title: c, data: c}));
                    
                    renderizarDataTables(results.data, colunas);
                    document.getElementById('titulo-tabela').innerText = `Visualizando: ${tipo.toUpperCase()}`;
                },
                error: function(err, file, inputElem, reason) {
                    console.log("Erro PapaParse:", err);
                    alert(`Erro ao ler arquivo: ${reason}. Verifique o Console (F12) para detalhes.`);
                }
            });
        }

        function renderizarDataTables(dados, colunas) {
            if (dataTable) {
                dataTable.destroy();
                $('#tabela-dados').empty(); 
            }

            dataTable = $('#tabela-dados').DataTable({
                data: dados,
                columns: colunas,
                language: { url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json' },
                pageLength: 10,
                responsive: true,
                scrollX: true 
            });
        }
    </script>
