name: 🚜 Extração Pesada (A cada hora - 15h às 06h MT)

on:
  schedule:
    # Roda de hora em hora (Minuto 0). 
    # Em Cuiabá (UTC-4): Inicia às 15:00 e vai até as 06:00 da manhã.
    - cron: '0 0-10,19-23 * * *'
  workflow_dispatch:

jobs:
  fechamento:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Baixar o Código
        uses: actions/checkout@v4

      - name: 🐍 Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar as Bibliotecas Necessárias
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager pandas supabase

      - name: 🚜 1. Rodar Extração SISREG (CSV)
        env:
          SISREG_USER: ${{ secrets.SISREG_USER }}
          SISREG_PASS: ${{ secrets.SISREG_PASS }}
        run: python backend/extracao_sisreg_v18.py

      - name: 🗄️ 2. Processar e Enviar para Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python backend/processar_regulacao_v21.py